version: 1

# Opt-in hardware time basis. Recalibrate camera/IMU timing for this config.
# Geometry stays unified_480_ccw90. Both image streams use footer t62 (ns).
service:
  namespace: xreal_air2ultra_linux
  registry_path: /tmp/capture_service_streams.json
  slot_count: 256
  publish: [shm]
  tcp:
    bind_host: 0.0.0.0
    port: 45660
    client_queue_size: 256

camera:
  enabled: true
  driver: xreal_ultra
  timestamp_mode: device
  layout: xreal_packed
  slot_count: 8
  primary:
    device:
      linux: /dev/video0
    index: 0
    api:
      linux: v4l2
      windows: auto
    width: 640
    height: 241
    fps: 60
    raw_format: true
    convert_rgb: false
    buffer_size: 1
  output:
    left_stream: camera0
    right_stream: camera1
    left_frame: camera0
    right_frame: camera1
    width: 480
    height: 640
  transform:
    left:
      rotate: ccw90
      flip: none
    right:
      rotate: ccw90
      flip: xy
  stall_exit_ms: 2000

imu:
  enabled: true
  driver: xreal_hid
  slot_count: 2048
  output:
    stream: imu0
    frame: imu0
  raw:
    enabled: true
    stream: xreal_raw_hid
    frame: xreal_raw_hid
    payload_size: 256
    slot_count: 2048
  xreal_hid:
    timestamp_mode: device
    vendor_id: 0x3318
    product_id: 0x0426
    interface: 2
    drop_first_packets: 500
    read_timeout_ms: 100
  stall_exit_ms: 2000
