version: 1

service:
  namespace: external_stereo_xreal_imu
  registry_path: /tmp/capture_service_streams.json
  publish: [shm]

camera:
  enabled: true
  driver: opencv
  slot_count: 8
  layout: side_by_side_horizontal
  stereo_order: left_right
  primary:
    device:
      linux: /dev/video2
    index: 1
    api: auto
    width: 1280
    height: 480
    fps: 90
    raw_format: false
    convert_rgb: true
    buffer_size: 1
  output:
    left_stream: camera0
    right_stream: camera1
    width: 640
    height: 480
  transform:
    left:
      rotate: none
      flip: none
    right:
      rotate: none
      flip: none

# Camera and IMU are independent: this can keep the glasses HID IMU while the
# images come from another camera device.
imu:
  enabled: true
  driver: xreal_hid
  slot_count: 2048
  output:
    stream: imu0
  raw:
    enabled: true
    stream: xreal_raw_hid
    payload_size: 64
    slot_count: 2048
    slot_count: 2048
