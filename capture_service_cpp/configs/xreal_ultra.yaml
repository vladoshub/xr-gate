version: 1

# Informational metadata. capture_service_cpp ignores these fields.
metadata:
  rig:
    name: xreal_air2_ultra
    serial: ZBBM5DZFMP
    calibration_profile: ~/src/xr_tracking/calibration_dataset/final/xreal_air2ultra/ZBBM5DZFMP/basalt_calib_unified_480x640.json
    vio_config: ~/src/xr_tracking/calibration_dataset/final/xreal_air2ultra/ZBBM5DZFMP/basalt_vio_config_unified_480x640.json
    convention: "camera0=cw90(front_left), camera1=cw90(front_right)"
    resolution: 480x640

service:
  profile: xreal_air2ultra_unified_480
  namespace: xreal_air2ultra_linux
  registry_path: /tmp/capture_service_streams.json
  slot_count: 256
  publish: [shm]
  tcp:
    bind_host: 0.0.0.0
    port: 45660
    client_queue_size: 256

camera:
  enabled: true
  driver: xreal_ultra
  layout: xreal_packed
  slot_count: 8
  primary:
    device:
      linux: /dev/video0
    index: 0
    api:
      linux: v4l2
      windows: auto
    width: 640
    height: 241
    fps: 60
    raw_format: true
    convert_rgb: false
    buffer_size: 1
  output:
    left_stream: camera0
    right_stream: camera1
    left_frame: camera0
    right_frame: camera1
    width: 480
    height: 640
  transform:
    left:
      rotate: ccw90
      flip: none
    right:
      rotate: ccw90
      flip: xy
  stall_exit_ms: 2000

imu:
  enabled: true
  driver: xreal_hid
  slot_count: 2048
  output:
    stream: imu0
    frame: imu0
  # No imu.transform section: identity mapping preserves the verified XREAL Ultra path.
  raw:
    enabled: true
    stream: xreal_raw_hid
    frame: xreal_raw_hid
    payload_size: 64
    slot_count: 2048
  xreal_hid:
    vendor_id: 0x3318
    product_id: 0x0426
    interface: 2
    drop_first_packets: 500
    read_timeout_ms: 100
  stall_exit_ms: 2000