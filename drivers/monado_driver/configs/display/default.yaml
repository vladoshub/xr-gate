# Default Monado display/optics profile.
# Values preserve the historical xr_monado_driver defaults.
display:
  width_px: 3840
  height_px: 1080
  layout: side_by_side_horizontal
  eye_width_px: 1920
  eye_height_px: 1080
  refresh_hz: 90
  rotation_deg: 0

optics:
  ipd_m: 0.064
  inter_lens_distance_m: 0.064
  # Not used while identity distortion is active. Kept in the shared schema so
  # a future Cardboard/distortion implementation can use the same profile.
  screen_to_lens_distance_m: 0.0
  eye_to_lens_distance_m: 0.0

  left_eye:
    lens_center_uv: [0.5, 0.5]
    fov_deg:
      # Historical Monado default was 1.0 radian for every half-angle.
      left: 57.29577951308232
      right: 57.29577951308232
      up: 57.29577951308232
      down: 57.29577951308232

  right_eye:
    lens_center_uv: [0.5, 0.5]
    fov_deg:
      left: 57.29577951308232
      right: 57.29577951308232
      up: 57.29577951308232
      down: 57.29577951308232
