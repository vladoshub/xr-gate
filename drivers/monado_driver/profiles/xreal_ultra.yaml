# XREAL Air 2 Ultra SBS projection (raw tangents 0.700 horizontal, 0.394 vertical).
display:
  width_px: 3840
  height_px: 1080
  layout: side_by_side_horizontal
  eye_width_px: 1920
  eye_height_px: 1080
  refresh_hz: 90
  rotation_deg: 0

optics:
  ipd_m: 0.064
  inter_lens_distance_m: 0.064
  # Not used while identity distortion is active. Kept in the shared schema so
  # a future Cardboard/distortion implementation can use the same profile.
  screen_to_lens_distance_m: 0.0
  eye_to_lens_distance_m: 0.0

  left_eye:
    lens_center_uv: [0.5, 0.5]
    fov_deg:
      left: 34.992020198558663
      right: 34.992020198558663
      up: 21.504440240813054
      down: 21.504440240813054

  right_eye:
    lens_center_uv: [0.5, 0.5]
    fov_deg:
      left: 34.992020198558663
      right: 34.992020198558663
      up: 21.504440240813054
      down: 21.504440240813054
