name: XR Gate split build

"on":
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ubuntu_amd64:
        description: "Build Ubuntu AMD64 (24.04 and 26.04)"
        type: boolean
        required: false
        default: true
      build_ubuntu_arm64:
        description: "Build Ubuntu ARM64 (24.04 and 26.04)"
        type: boolean
        required: false
        default: false
      build_ubuntu_riscv64:
        description: "Build Ubuntu 24.04 RISC-V 64 (RV64GC, QEMU)"
        type: boolean
        required: false
        default: false
      build_ubuntu_rva23s64:
        description: "Build Ubuntu 26.04 RISC-V 64 (RVA23S64, QEMU)"
        type: boolean
        required: false
        default: false
      cpu_profile:
        description: "AMD64 CPU profile (ARM64 uses aarch64)"
        type: choice
        options: [avx2, generic, avx512, native]
        required: false
        default: avx2
      onnxruntime_version:
        description: "ONNX Runtime version for Linux Mercury and FRAME"
        type: choice
        options: ["1.31.0", "1.18.1"]
        required: false
        default: "1.31.0"
      openvr_frequencies:
        description: "Linux OpenVR driver frequencies to build"
        required: false
        default: "60 90"
      openvr_modes:
        description: "Linux OpenVR driver modes to build"
        required: false
        default: "direct"
      windows_openvr_frequencies:
        description: "Windows OpenVR driver frequencies to build (for example 60 90)"
        type: string
        required: false
        default: "60 90"
      windows_openvr_modes:
        description: "Windows OpenVR driver modes to build (direct, extended_sbs)"
        type: string
        required: false
        default: "direct extended_sbs"
      include_xrizer:
        description: "Build optional xrizer GPL component with license and Corresponding Source"
        type: boolean
        required: false
        default: false
      include_vendor_components:
        description: "Build pure vendor components such as xreal_display_helper"
        type: boolean
        required: false
        default: true
      upload_partial_artifacts:
        description: "Upload each partial out package, not only the merged package"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload final artifacts to a GitHub Release"
        type: boolean
        required: false
        default: false
      release_windows_driver:
        description: "Build Windows AMD64 release (includes SteamVR driver)"
        type: boolean
        required: false
        default: true
      release_tag:
        description: "Release tag, for example v0.1.0"
        type: string
        required: false
        default: "v0.1.0"
      release_prerelease:
        description: "Mark release as prerelease"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: xr-gate-split-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # Local builds keep OpenCV build trees by default; CI/act use disposable jobs.
  XR_KEEP_OPENCV_BUILD: "0"
  XR_BUILD_CAPTURE_SERVICE_PYTHON: "0"
  XR_DOWNLOAD_HAND_TRACKING_MODELS: "0"
  XR_DOWNLOAD_BODY_TRACKING_MODELS: "0"
  XR_ONNXRUNTIME_VERSION: ${{ inputs.onnxruntime_version }}
  XR_BUILD_XRIZER: ${{ github.event_name == 'workflow_dispatch' && inputs.include_xrizer && '1' || '0' }}
  XR_BUILD_VENDOR_COMPONENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_vendor_components == false && '0' || '1' }}
  XR_OPENVR_BUILD_FREQUENCIES: ${{ github.event_name == 'workflow_dispatch' && inputs.openvr_frequencies || '60 90' }}
  XR_OPENVR_BUILD_MODES: ${{ github.event_name == 'workflow_dispatch' && inputs.openvr_modes || 'direct' }}
  # Every Windows package includes the automatic selection's 60 Hz fallback.
  XR_WINDOWS_OPENVR_BUILD_FREQUENCIES: ${{ format('60 {0}', github.event_name == 'workflow_dispatch' && inputs.windows_openvr_frequencies || '60 90') }}
  XR_WINDOWS_OPENVR_BUILD_MODES: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_openvr_modes || 'direct extended_sbs' }}
  XR_RELEASE_WINDOWS_DRIVER: ${{ github.event_name == 'workflow_dispatch' && inputs.release_windows_driver && '1' || '0' }}

defaults:
  run:
    shell: bash

jobs:

  dispatch-info:
    name: workflow dispatch parameters
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 5
    steps:
      - name: Print workflow inputs
        env:
          TYPED_INPUTS: ${{ toJSON(inputs) }}
          EVENT_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail

          {
            echo "## Workflow dispatch inputs"
            echo
            echo "### Typed inputs"
            echo '```json'
            echo "$TYPED_INPUTS"
            echo '```'
            echo
            echo "### Event inputs"
            echo '```json'
            echo "$EVENT_INPUTS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-unpack-helper:
    name: release unpack helper
    needs: plan-linux
    if: ${{ needs.plan-linux.outputs.release_arches != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and build standalone unpack helper
        run: |
          set -euo pipefail
          test -x devices/common/linux/scripts/release/unpack_xr_gate.sh
          test -x devices/common/linux/scripts/release/unpack_device_release.sh
          bash -n devices/common/linux/scripts/release/unpack_xr_gate.sh
          bash -n devices/common/linux/scripts/release/unpack_device_release.sh

          mkdir -p release-helper
          {
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail'
            printf '%s\n' \
              'export XR_RELEASE_DEVICE_TARGET="xr-gate"' \
              'export XR_RELEASE_DEVICE_DISPLAY_NAME="XR Gate"' \
              'export XR_RELEASE_REQUIRE_DEVICE="0"'
            tail -n +3 devices/common/linux/scripts/release/unpack_device_release.sh
          } > release-helper/unpack_xr_gate.sh
          chmod +x release-helper/unpack_xr_gate.sh
          bash -n release-helper/unpack_xr_gate.sh
          release-helper/unpack_xr_gate.sh --help | grep -F 'XR Gate'
          ls -lh release-helper/unpack_xr_gate.sh

      - name: Upload unpack helper
        uses: actions/upload-artifact@v4
        with:
          name: unpack-xr-gate
          path: release-helper/unpack_xr_gate.sh
          if-no-files-found: error
          retention-days: 7

  plan-linux:
    name: Select Linux build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      release_arches: ${{ steps.targets.outputs.release_arches }}
      cpu_profiles: ${{ steps.targets.outputs.cpu_profiles }}
      riscv_targets: ${{ steps.targets.outputs.riscv_targets }}
      riscv_ubuntu_versions: ${{ steps.targets.outputs.riscv_ubuntu_versions }}
    steps:
      - name: Select CPU profiles and runners
        id: targets
        env:
          BUILD_AMD64: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_ubuntu_amd64) && '1' || '0' }}
          BUILD_ARM64: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ubuntu_arm64 && '1' || '0' }}
          BUILD_RISCV64: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ubuntu_riscv64 && '1' || '0' }}
          BUILD_RVA23S64: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ubuntu_rva23s64 && '1' || '0' }}
          AMD64_CPU_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.cpu_profile || 'avx2' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          targets = []
          if os.environ["BUILD_AMD64"] == "1":
              targets.append(dict(arch="x64", runner="ubuntu-24.04", cpu=os.environ["AMD64_CPU_PROFILE"]))
          if os.environ["BUILD_ARM64"] == "1":
              targets.append(dict(arch="arm64", runner="ubuntu-24.04-arm", cpu="aarch64"))

          riscv_targets = []
          if os.environ["BUILD_RISCV64"] == "1":
              riscv_targets.append(dict(ubuntu="24.04", cpu="riscv64", qemu_cpu="rv64,v=false"))
          if os.environ["BUILD_RVA23S64"] == "1":
              riscv_targets.append(dict(ubuntu="26.04", cpu="rva23s64", qemu_cpu="rva23s64"))

          release_arches = [target["arch"] for target in targets]
          profiles = [f"{target['arch']}={target['cpu']}" for target in targets]
          if riscv_targets:
              release_arches.append("riscv64")
              profiles.extend(f"riscv64/{target['ubuntu']}={target['cpu']}" for target in riscv_targets)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("targets=" + json.dumps(targets), file=output)
              print("release_arches=" + " ".join(release_arches), file=output)
              print("cpu_profiles=" + ", ".join(profiles), file=output)
              print("riscv_targets=" + json.dumps(riscv_targets), file=output)
              print("riscv_ubuntu_versions=" + " ".join(target["ubuntu"] for target in riscv_targets), file=output)
          PY

  build-opencv:
    name: OpenCV SDK / Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    needs: plan-linux
    if: ${{ needs.plan-linux.outputs.targets != '[]' }}
    env:
      XR_BUILD_CPU: ${{ matrix.target.cpu }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        target: ${{ fromJSON(needs.plan-linux.outputs.targets) }}
    steps:
      - name: Bootstrap OpenCV build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build python3 ccache nasm
      - uses: actions/checkout@v6
      - name: Build static OpenCV once for this CPU profile and run
        env:
          XR_OPENCV_PREFIX: ${{ github.workspace }}/opencv-sdk
        run: bash devices/common/linux/scripts/build/build_opencv.sh
      - name: Archive current-run SDK
        run: tar -czf opencv-sdk.tar.gz opencv-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: opencv-sdk-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-${{ matrix.ubuntu }}-${{ env.XR_BUILD_CPU }}
          path: opencv-sdk.tar.gz
          retention-days: 1
          compression-level: 0

  build-part:
    name: build ${{ matrix.component.name }} / Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    needs: [plan-linux, build-opencv]
    if: ${{ needs.plan-linux.outputs.targets != '[]' }}
    env:
      XR_BUILD_CPU: ${{ matrix.target.cpu }}
      XR_RELEASE_ARCH: ${{ matrix.target.arch }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        target: ${{ fromJSON(needs.plan-linux.outputs.targets) }}
        component:
          - name: capture
            build_only: "capture_service_cpp xreal_display_helper"
          - name: runtime
            build_only: "imu_3dof xr_runtime_adapter override_controller xr_video bridges"
          - name: spatial
            build_only: "xr_spatial"
          - name: steamvr
            build_only: "openvr_driver steamvr_video_overlay steamvr_spatial_overlay steamvr_spatial_scene"
          - name: basalt
            build_only: "basalt_vio"
          - name: mercury
            build_only: "mercury_hand_tracking frame_body_tracking"
          - name: monado
            build_only: "monado_driver"

    steps:
      - name: Bootstrap build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git git-lfs ca-certificates
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = '${{ matrix.ubuntu }}'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Configure Git workspace trust in container
        run: |
          # checkout uses a temporary HOME for its safe.directory configuration.
          # Persist trust for this workspace in the configuration used by run steps.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Validate common build/package wrappers
        run: |
          set -euo pipefail
          scripts=(
            devices/common/linux/scripts/build/device_out_env.sh
            devices/common/linux/scripts/build/xr_gate_out_env.sh
            devices/common/linux/scripts/build/install_device_out.sh
            devices/common/linux/scripts/build/build_steps.sh
            devices/common/linux/scripts/build/install_build_deps_ubuntu.sh
            devices/common/linux/scripts/build/dependency_policy.sh
            devices/common/linux/scripts/build/update_build_dependencies.sh
            devices/common/linux/scripts/build/with_build_session.sh
            devices/common/linux/scripts/build/build_opencv.sh
            devices/common/linux/scripts/build/prepare_opencv_source.sh
            devices/common/linux/scripts/build/opencv_env.sh
            devices/common/linux/scripts/build/install_xr_gate_out.sh
            devices/common/linux/scripts/build/package_device_out.sh
            devices/common/linux/scripts/build/package_xr_gate_out.sh
            devices/common/linux/scripts/build/build_vendor_components.sh
            devices/common/linux/scripts/build/package_vendor_components.sh
            drivers/build_profiles.sh
            drivers/openvr_driver/scripts/build_driver.sh
            drivers/openvr_driver/scripts/build_and_register_driver.sh
            drivers/openvr_driver/scripts/register_driver.sh
            drivers/monado_driver/scripts/linux/install.sh
            drivers/monado_driver/scripts/linux/start.sh
            drivers/xrizer/scripts/linux/package_xrizer_compliance.sh
            devices/common/linux/scripts/ci/run_act_build.sh
            devices/common/linux/scripts/ci/run_xr_gate_act_build.sh
            devices/common/linux/scripts/release/unpack_device_release.sh
            devices/common/linux/scripts/release/unpack_xr_gate.sh
            devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
            devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
            devices/xreal_ultra/linux/scripts/package_xreal_ultra_out.sh
            devices/xreal_ultra/linux/scripts/run_xreal_ultra_act_build.sh
            devices/xreal_ultra/linux/scripts/unpack_xreal_ultra.sh
            devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
            devices/xreal_ultra/linux/scripts/install_xreal_ultra_device_access.sh
            devices/xreal_ultra/linux/scripts/build_xreal_ultra_components.sh
            devices/xreal_ultra/linux/scripts/package_xreal_ultra_components.sh
          )
          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
          done

      - name: Prepare selected build dependencies
        env:
          XR_BUILD_ONLY: ${{ matrix.component.build_only }}
        run: |
          bash devices/common/linux/scripts/build/install_build_deps_ubuntu.sh
          git lfs install --local

      - name: Test device discovery and driver packaging matrix
        run: python3 -m unittest discover -s drivers/tests -p 'test*.py'

      - name: Check native build orchestration
        if: ${{ matrix.component.name == 'basalt' }}
        run: python3 -m unittest discover -s devices/common/linux/scripts/build/tests -v

      - name: Download OpenCV SDK from this run and attempt
        uses: actions/download-artifact@v4
        with:
          name: opencv-sdk-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-${{ matrix.ubuntu }}-${{ env.XR_BUILD_CPU }}
          path: .build-deps

      - name: Unpack current-run OpenCV SDK
        run: tar -xzf .build-deps/opencv-sdk.tar.gz -C .build-deps

      - name: Build partial package
        env:
          XR_OUT_ROOT: ${{ github.workspace }}/out/xr-gate
          XR_BUILD_ONLY: ${{ matrix.component.build_only }}
          XR_PACKAGE_ALLOW_PARTIAL: "1"
          CLONE_OPENVR: "1"
          CLONE_MONADO: "1"
          BASALT_BUILD_JOBS: "2"
          XR_OPENCV_PREFIX: ${{ github.workspace }}/.build-deps/opencv-sdk
        run: |
          df -h
          ./devices/common/linux/scripts/build/install_xr_gate_out.sh
          du -sh out/xr-gate || true
          find out/xr-gate -maxdepth 4 -type f | sort | sed -n '1,200p'

      - name: Validate packaged FRAME backend
        if: ${{ matrix.component.name == 'mercury' }}
        run: |
          set -euo pipefail
          source devices/common/linux/scripts/runtime/onnxruntime_path.sh
          ort_package="$(xr_onnxruntime_package_name)"
          test -f "out/xr-gate/bin/onnxruntime/$ort_package/lib/libonnxruntime.so"
          test "$(cat out/xr-gate/bin/backends/mercury_hand_tracking/ONNXRUNTIME_PACKAGE)" = "$ort_package"
          test -x out/xr-gate/bin/backends/frame_body_tracking/frame_body_tracking_backend
          test -x out/xr-gate/devices/common/linux/scripts/frame_body_tracking/start_frame_body_tracking.sh
          test -x out/xr-gate/bin/scripts/backends/frame_body_tracking/start_frame_body_tracking.sh
          bash -n out/xr-gate/devices/common/linux/scripts/frame_body_tracking/start_frame_body_tracking.sh
          bash -n out/xr-gate/bin/scripts/backends/frame_body_tracking/start_frame_body_tracking.sh
          env -u LD_LIBRARY_PATH out/xr-gate/bin/backends/frame_body_tracking/frame_body_tracking_backend --help

      - name: Validate device-specific driver outputs
        if: ${{ matrix.component.name == 'steamvr' || matrix.component.name == 'monado' }}
        env:
          DRIVER_KIND: ${{ matrix.component.name }}
        run: |
          python3 - <<'PY_CHECK'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("drivers").resolve()))
          from device_profiles import configured_devices
          kind = os.environ["DRIVER_KIND"]
          driver_arch = "linuxarm64" if os.environ["XR_RELEASE_ARCH"] == "arm64" else "linux64"
          for device in configured_devices(Path.cwd(), kind):
              base = Path("out/xr-gate/bin/drivers") / device
              if kind == "steamvr":
                  variants = list(base.glob("openvr_driver_*HZ*/xr_tracking"))
                  assert variants, f"No SteamVR package for {device}"
                  for package in variants:
                      settings = json.loads((package / "resources/settings/default.vrsettings").read_text())["xr_tracking"]
                      assert settings["deviceProfile"] == device, str(package)
                      assert (package / "bin" / driver_arch / "driver_xr_tracking.so").is_file(), str(package)
              else:
                  package = base / "monado_driver"
                  assert (package / "device-profile").read_text().strip() == device
                  assert (package / "monado-service").is_file()
                  manifest = json.loads((package / "openxr_monado_xrgate.json").read_text())
                  library = Path(manifest["runtime"]["library_path"])
                  assert not library.is_absolute(), str(library)
                  assert (package / library).is_file(), str(package / library)
                  assert (package / "start.sh").is_file()
          PY_CHECK

      - name: Validate capture launchers and TCP metadata probe
        if: ${{ matrix.component.name == 'capture' }}
        run: |
          set -euo pipefail
          test -x out/xr-gate/bin/scripts/capture_service_cpp/start_capture_service_cpp.sh
          test -x out/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service_cpp.sh
          test -x out/xr-gate/bin/capture_service_cpp/capture_tcp_probe
          bash -n out/xr-gate/bin/scripts/capture_service_cpp/start_capture_service_cpp.sh
          bash -n out/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service_cpp.sh
          out/xr-gate/bin/capture_service_cpp/capture_tcp_probe --help >/dev/null

          if [[ "$XR_BUILD_VENDOR_COMPONENTS" == "1" ]]; then
            test -x out/xr-gate/bin/xreal_display_helper/xreal_display_helper
          else
            test ! -e out/xr-gate/bin/xreal_display_helper/xreal_display_helper
          fi

          READY_FILE="$(mktemp)"
          rm -f "$READY_FILE"
          export READY_FILE
          python3 - <<'PY' &
          import json
          import os
          import socket

          hello = json.dumps({
              "protocol": "capture_net_v1_json_payload",
              "namespace": "ci_capture",
              "profile": "leap_motion_uvc_nrf54l15",
              "streams": {},
          }, separators=(",", ":")).encode("utf-8")

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(("127.0.0.1", 45679))
              server.listen(1)
              open(os.environ["READY_FILE"], "w", encoding="utf-8").close()
              connection, _ = server.accept()
              with connection:
                  connection.sendall(f"CAPHELLO {len(hello)}\n".encode("ascii"))
                  connection.sendall(hello)
                  connection.recv(64)
          PY
          SERVER_PID=$!
          for _ in $(seq 1 50); do
            [[ -f "$READY_FILE" ]] && break
            sleep 0.1
          done
          test -f "$READY_FILE"
          PROFILE="$(out/xr-gate/bin/capture_service_cpp/capture_tcp_probe \
            --host 127.0.0.1 \
            --port 45679 \
            --timeout-ms 2000 \
            --print-profile)"
          wait "$SERVER_PID"
          rm -f "$READY_FILE"
          test "$PROFILE" = "leap_motion_uvc_nrf54l15"

      - name: Validate capture profile resolver
        if: ${{ matrix.component.name == 'runtime' }}
        run: |
          bash backends/common/tests/capture_profile_smoke.sh

      - name: Validate common/device script separation
        if: ${{ matrix.component.name == 'runtime' }}
        run: |
          set -euo pipefail
          test -x out/xr-gate/devices/common/linux/scripts/basalt_vio/start_basalt.sh
          test -x out/xr-gate/devices/common/linux/scripts/mercury_hand_tracking/start_hand_tracking.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/xreal_display_helper/start_xreal_helper_60hz.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/monado_driver/double_display_fix.sh
          test -x out/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_device_access.sh
          test ! -e out/xr-gate/devices/common/linux/scripts/build
          test ! -e out/xr-gate/devices/common/linux/scripts/ci
          test ! -e out/xr-gate/devices/common/linux/scripts/release
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/package_xreal_ultra_out.sh
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/basalt_vio
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/capture_service
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/xr_spatial
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/xr_video

      - name: Validate xr_spatial SHM/TCP launchers
        if: ${{ matrix.component.name == 'spatial' }}
        run: |
          set -euo pipefail
          test -x out/xr-gate/bin/backends/xr_spatial/xr_spatial_backend
          test -x out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_shm.sh
          test -x out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_tcp.sh
          test -x out/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
          test -x out/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_shm.sh
          test -x out/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          bash -n out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_shm.sh
          bash -n out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_tcp.sh
          bash -n out/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
          bash -n out/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          HELP_FILE="$(mktemp)"
          trap 'rm -f "$HELP_FILE"' EXIT
          out/xr-gate/bin/backends/xr_spatial/xr_spatial_backend \
            --help >"$HELP_FILE" 2>&1
          grep -Fq -- '--capture-transport' "$HELP_FILE"
          grep -Fq -- '--capture-tcp-host' "$HELP_FILE"


      - name: Archive partial package
        run: |
          tar -C out -czf xr-gate_${{ matrix.component.name }}.tar.gz xr-gate
          ls -lh xr-gate_${{ matrix.component.name }}.tar.gz

      - name: Upload partial package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_partial_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-part-ubuntu-${{ matrix.ubuntu }}-${{ matrix.target.arch }}-${{ matrix.component.name }}
          path: xr-gate_${{ matrix.component.name }}.tar.gz
          retention-days: 3

      - name: Upload merge input
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-merge-input-ubuntu-${{ matrix.ubuntu }}-${{ matrix.target.arch }}-${{ matrix.component.name }}
          path: xr-gate_${{ matrix.component.name }}.tar.gz
          retention-days: 3


  build-riscv64:
    name: build ${{ matrix.component.name }} / Ubuntu ${{ matrix.target.ubuntu }} / riscv64
    runs-on: ubuntu-24.04
    needs: plan-linux
    if: ${{ needs.plan-linux.outputs.riscv_targets != '[]' }}
    timeout-minutes: 350
    env:
      XR_BUILD_CPU: ${{ matrix.target.cpu }}
      XR_RISCV_UBUNTU: ${{ matrix.target.ubuntu }}
      QEMU_CPU: ${{ matrix.target.qemu_cpu }}
      XR_BUILD_XRIZER: "0"
      XR_OFFLINE: "0"
      BUILD_JOBS: "3"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      XR_BUILD_ONLY: ${{ matrix.component.build_only }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan-linux.outputs.riscv_targets) }}
        component:
          - name: core
            build_only: "capture_service_cpp xreal_display_helper imu_3dof xr_runtime_adapter override_controller xr_video xr_spatial bridges monado_driver"
          - name: basalt
            build_only: "basalt_vio"
          - name: mercury
            build_only: "mercury_hand_tracking frame_body_tracking"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable RISC-V user-mode emulation
        if: ${{ matrix.target.cpu == 'riscv64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          sudo systemctl restart systemd-binfmt

      - name: Enable RVA23S64 user-mode emulation
        if: ${{ matrix.target.cpu == 'rva23s64' }}
        run: |
          set -euo pipefail
          # tonistiigi/binfmt:qemu-v10.2.3-68. The Ubuntu 24.04 runner ships an older QEMU.
          image=tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          if [[ -e /proc/sys/fs/binfmt_misc/qemu-riscv64 ]]; then
            docker run --privileged --rm "$image" --uninstall qemu-riscv64
          fi
          docker run --privileged --rm -e QEMU_PRESERVE_ARGV0=1 "$image" --install riscv64
          grep -E '^flags:.*P.*F' /proc/sys/fs/binfmt_misc/qemu-riscv64

      - name: Build RISC-V package component
        run: |
          set -euo pipefail
          docker run --rm -i --platform linux/riscv64 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" --workdir /work \
            -e DEBIAN_FRONTEND -e QEMU_CPU \
            -e XR_BUILD_CPU -e XR_BUILD_ONLY -e XR_BUILD_VENDOR_COMPONENTS -e XR_BUILD_XRIZER \
            -e XR_RISCV_UBUNTU \
            -e XR_KEEP_OPENCV_BUILD -e XR_OFFLINE -e XR_ONNXRUNTIME_VERSION \
            -e XR_DOWNLOAD_HAND_TRACKING_MODELS -e XR_DOWNLOAD_BODY_TRACKING_MODELS \
            -e BUILD_JOBS -e CMAKE_BUILD_PARALLEL_LEVEL \
            -e "XR_BUILD_UID=$(id -u)" -e "XR_BUILD_GID=$(id -g)" \
            -e "XR_RISCV_COMPONENT=${{ matrix.component.name }}" \
            "riscv64/ubuntu:$XR_RISCV_UBUNTU" bash -euo pipefail <<'BUILD'
          test "$(uname -m)" = riscv64
          . /etc/os-release
          test "$VERSION_ID" = "$XR_RISCV_UBUNTU"
          ./devices/common/linux/scripts/build/install_build_deps_ubuntu.sh
          export HOME=/tmp/xr-gate-builder
          install -d -o "$XR_BUILD_UID" -g "$XR_BUILD_GID" "$HOME"
          setpriv --reuid="$XR_BUILD_UID" --regid="$XR_BUILD_GID" --clear-groups \
            bash -euo pipefail <<'AS_BUILDER'
          ./devices/common/linux/scripts/build/install_xr_gate_out.sh
          package="out/$XR_BUILD_CPU/xr-gate"
          test "$(jq -r .profile "$package/BUILD_CPU_PROFILE.json")" = "$XR_BUILD_CPU"
          case "$XR_RISCV_COMPONENT" in
            core)
              "$package/bin/capture_service_cpp/capture_tcp_probe" --help >/dev/null
              ;;
            basalt)
              "$package/bin/backends/basalt_vio/capture_basalt_backend" --help >/dev/null
              ;;
            mercury)
              source devices/common/linux/scripts/runtime/onnxruntime_path.sh
              test "$(cat "$package/bin/backends/mercury_hand_tracking/ONNXRUNTIME_PACKAGE")" = "$(xr_onnxruntime_package_name)"
              "$package/bin/backends/frame_body_tracking/frame_body_tracking_backend" --help >/dev/null
              ;;
          esac
          rm -rf "$package/bin/python-runtime/venv"
          AS_BUILDER
          BUILD
          tar -C "out/$XR_BUILD_CPU" -czf "xr-gate_${{ matrix.component.name }}.tar.gz" xr-gate

      - uses: actions/upload-artifact@v4
        with:
          name: xr-gate-merge-input-ubuntu-${{ matrix.target.ubuntu }}-riscv64-${{ matrix.component.name }}
          path: xr-gate_${{ matrix.component.name }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.upload_partial_artifacts && 3 || 1 }}
          compression-level: 0

  merge-riscv64:
    name: merge runtime / Ubuntu ${{ matrix.target.ubuntu }} / riscv64
    runs-on: ubuntu-24.04
    needs: [plan-linux, build-riscv64]
    if: ${{ needs.plan-linux.outputs.riscv_targets != '[]' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan-linux.outputs.riscv_targets) }}
    env:
      XR_RISCV_UBUNTU: ${{ matrix.target.ubuntu }}
      XR_BUILD_CPU: ${{ matrix.target.cpu }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xr-gate-merge-input-ubuntu-${{ matrix.target.ubuntu }}-riscv64-*
          path: partials

      - name: Merge and validate RISC-V runtime
        run: |
          set -euo pipefail
          mkdir -p merged
          for part in core basalt mercury; do
            archive="partials/xr-gate-merge-input-ubuntu-$XR_RISCV_UBUNTU-riscv64-$part/xr-gate_$part.tar.gz"
            test "$(tar -xOzf "$archive" xr-gate/BUILD_CPU_PROFILE.json | jq -r .profile)" = "$XR_BUILD_CPU"
            tar -xzf "$archive" -C merged
          done
          package=merged/xr-gate
          test -x "$package/run_xr_client.sh"
          test -f "$package/LICENSES/MIT.txt"
          test "$(cat "$package/BUILD_OPENCV_LINKAGE")" = static-4.10.0
          for binary in \
            capture_service_cpp/capture_tcp_probe \
            backends/basalt_vio/capture_basalt_backend \
            backends/mercury_hand_tracking/libxr_mercury_runtime.so \
            backends/frame_body_tracking/frame_body_tracking_backend \
            drivers/xreal_ultra/monado_driver/monado-service \
            runtime_adapters/xr_runtime_adapter/xr_runtime_adapter; do
            LC_ALL=C readelf -h "$package/bin/$binary" | grep -E 'Machine:[[:space:]]+RISC-V$'
          done
          if [[ "$XR_BUILD_CPU" == rva23s64 ]]; then
            LC_ALL=C readelf -A "$package/bin/capture_service_cpp/capture_tcp_probe" | grep -E 'Tag_RISCV_arch:.*_v1p0(_|")'
          fi
          printf '%s\n' "$XR_RISCV_UBUNTU" > "$package/BUILD_UBUNTU_VERSION"
          tar -C merged -czf "xr-gate-ubuntu-$XR_RISCV_UBUNTU-linux-riscv64.tar.gz" xr-gate

      - uses: actions/upload-artifact@v4
        with:
          name: xr-gate-ubuntu-${{ matrix.target.ubuntu }}-linux-riscv64
          path: xr-gate-ubuntu-${{ matrix.target.ubuntu }}-linux-riscv64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-xrizer:
    name: build optional xrizer / Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    needs: [plan-linux, build-opencv]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan-linux.outputs.targets != '[]' && inputs.include_xrizer == true }}
    env:
      XR_BUILD_CPU: ${{ matrix.target.cpu }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        target: ${{ fromJSON(needs.plan-linux.outputs.targets) }}

    steps:
      - name: Bootstrap build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git git-lfs ca-certificates
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = '${{ matrix.ubuntu }}'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Configure Git workspace trust in container
        run: |
          # checkout uses a temporary HOME for its safe.directory configuration.
          # Persist trust for this workspace in the configuration used by run steps.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Prepare xrizer build dependencies
        env:
          XR_BUILD_ONLY: xrizer
        run: |
          bash devices/common/linux/scripts/build/install_build_deps_ubuntu.sh
          git lfs install --local

      - name: Download current CPU-profile OpenCV SDK
        uses: actions/download-artifact@v4
        with:
          name: opencv-sdk-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-${{ matrix.ubuntu }}-${{ env.XR_BUILD_CPU }}
          path: .build-deps

      - name: Unpack current-run SDK for native CPU validation
        run: tar -xzf .build-deps/opencv-sdk.tar.gz -C .build-deps

      - name: Build xrizer with GPL compliance material
        env:
          XR_OUT_ROOT: ${{ github.workspace }}/out/xr-gate
          XR_BUILD_ONLY: "xrizer"
          XR_BUILD_XRIZER: "1"
          XR_PACKAGE_ALLOW_PARTIAL: "1"
          XRIZER_PACKAGE_COMPLIANCE: "1"
          XRIZER_VENDOR_CARGO_SOURCES: "1"
          XRIZER_INSTALL_RUSTUP: "1"
          CLONE_XRIZER: "1"
          XR_OPENCV_PREFIX: ${{ github.workspace }}/.build-deps/opencv-sdk
        run: |
          set -euo pipefail
          ./devices/common/linux/scripts/build/install_xr_gate_out.sh

          XRIZER_PACKAGE="out/xr-gate/bin/drivers/xrizer"
          test -d "$XRIZER_PACKAGE/runtime"
          test -f "$XRIZER_PACKAGE/LICENSE.GPL-3.0-or-later"
          test -f "$XRIZER_PACKAGE/SOURCE.txt"
          test -f "$XRIZER_PACKAGE/SHA256SUMS.txt"
          test -f out/xr-gate/LICENSES/GPL-3.0-or-later.txt
          test -f out/xr-gate/SOURCES/xrizer/SOURCE.txt
          test -f out/xr-gate/SOURCES/xrizer/SHA256SUMS.txt

          SOURCE_ARCHIVE="$(find out/xr-gate/SOURCES/xrizer -maxdepth 1 -type f \
            -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
          test -n "$SOURCE_ARCHIVE"
          test -f "$SOURCE_ARCHIVE"
          tar -tzf "$SOURCE_ARCHIVE" > xrizer-source-files.txt
          grep -Fq '/SOURCE_INFO.txt' xrizer-source-files.txt
          grep -Fq '/BUILDING_XRIZER.md' xrizer-source-files.txt
          grep -Fq '/LICENSE' xrizer-source-files.txt
          grep -Fq '/vendor/' xrizer-source-files.txt
          (
            cd "$XRIZER_PACKAGE"
            sha256sum -c SHA256SUMS.txt
          )

          tar -C out -czf xr-gate_xrizer.tar.gz xr-gate
          ls -lh xr-gate_xrizer.tar.gz "$SOURCE_ARCHIVE"

      - name: Upload xrizer merge input
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-merge-input-ubuntu-${{ matrix.ubuntu }}-${{ matrix.target.arch }}-xrizer
          path: xr-gate_xrizer.tar.gz
          retention-days: 3

      - name: Upload xrizer Corresponding Source
        uses: actions/upload-artifact@v4
        with:
          name: xrizer-corresponding-source-ubuntu-${{ matrix.ubuntu }}-${{ matrix.target.arch }}
          path: out/xr-gate/SOURCES/xrizer/xrizer-corresponding-source-*.tar.gz
          if-no-files-found: error
          retention-days: 7


  hand-tracking-models-mercury:
    name: hand-tracking models Mercury
    needs: plan-linux
    if: ${{ needs.plan-linux.outputs.release_arches != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Prepare model download dependencies
        env:
          XR_BUILD_ONLY: hand_tracking_models
        run: |
          bash devices/common/linux/scripts/build/install_build_deps_ubuntu.sh
          git lfs install --local

      - name: Download Mercury hand-tracking models
        env:
          ROOT_PROJECT: ${{ github.workspace }}
          MERCURY_MODELS: ${{ github.workspace }}/out/xr-gate/bin/hand-tracking-models/mercury
          CLONE_MERCURY_DRIVER: "1"
          FETCH_MERCURY_DRIVER: "1"
          RESET_MERCURY_DRIVER_TREE: "1"
        run: |
          df -h
          bash backends/mercury_hand_tracking/scripts/linux/download_mercury_models.sh

          MODEL_DIR="out/xr-gate/bin/hand-tracking-models/mercury"
          test -f "$MODEL_DIR/grayscale_detection_160x160.onnx"
          test -f "$MODEL_DIR/grayscale_keypoint_jan18.onnx"

          mkdir -p model_artifact/hand-tracking-models/mercury
          cp -a "$MODEL_DIR"/*.onnx model_artifact/hand-tracking-models/mercury/

          cat > model_artifact/hand-tracking-models/mercury/SOURCE.txt <<'EOF'
          Mercury hand-tracking ONNX models.

          Files:
            grayscale_detection_160x160.onnx
            grayscale_keypoint_jan18.onnx

          Upstream:
            https://github.com/moshimeow/mercury_steamvr_driver

          Pinned ref:
            e3948ace94a9f2cbd949adf50ffcc082002337cc

          License/notice:
            These ONNX model files are third-party artifacts and are not covered by
            the MIT license of the xr_tracking project. They remain under their
            upstream terms. Keep this notice with redistributed copies.

          Install into a downloaded XR Gate runtime package:
            tar -C out/xr-gate/bin -xzf hand-tracking-models-mercury.tar.gz
          EOF

          (
            cd model_artifact/hand-tracking-models/mercury
            sha256sum *.onnx > SHA256SUMS.txt
          )

          find model_artifact -type f -print -exec ls -lh {} \;
          tar -C model_artifact -czf hand-tracking-models-mercury.tar.gz hand-tracking-models
          ls -lh hand-tracking-models-mercury.tar.gz

      - name: Upload Mercury hand-tracking models
        uses: actions/upload-artifact@v4
        with:
          name: hand-tracking-models-mercury
          path: hand-tracking-models-mercury.tar.gz
          retention-days: 7

  body-tracking-models-frame:
    name: body-tracking model FRAME
    needs: plan-linux
    if: ${{ needs.plan-linux.outputs.release_arches != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and export the FRAME backbone
        env:
          XR_BIN_ROOT: ${{ github.workspace }}/model_artifact
        run: bash backends/frame_body_tracking/scripts/linux/download_frame_models.sh

      - name: Check ONNX Runtime compatibility and archive the model
        run: |
          set -euo pipefail
          MODEL_DIR=model_artifact/body-tracking-models/frame
          (cd "$MODEL_DIR" && sha256sum -c SHA256SUMS.txt)
          source devices/common/linux/scripts/runtime/onnxruntime_path.sh
          ort_version="$(xr_onnxruntime_version)"
          python3 -m venv "$RUNNER_TEMP/frame-onnx-check"
          "$RUNNER_TEMP/frame-onnx-check/bin/python" -m pip install 'numpy<2' "onnxruntime==$ort_version"
          "$RUNNER_TEMP/frame-onnx-check/bin/python" - "$MODEL_DIR/frame_backbone.onnx" <<'PY'
          import sys
          import numpy as np
          import onnxruntime as ort

          size = 256
          focal, center = 82 / size, (size - 1) * 0.5 / size
          K = np.array([[focal, 0, center], [0, focal, center], [0, 0, 1]], dtype=np.float32)
          session = ort.InferenceSession(sys.argv[1], providers=["CPUExecutionProvider"])
          uv, xyz = session.run(["uv", "xyz"], {
              "images": np.zeros((1, 1, 2, 3, size, size), dtype=np.float32),
              "K": np.tile(K, (1, 2, 1, 1)),
              "d": np.zeros((1, 2, 4), dtype=np.float32),
          })
          assert uv.shape == (1, 1, 2, 15, 2) and np.isfinite(uv).all()
          assert xyz.shape == (1, 1, 2, 15, 3) and np.isfinite(xyz).all()
          PY
          tar -C model_artifact -czf body-tracking-models-frame.tar.gz body-tracking-models

      - name: Upload FRAME body-tracking model
        uses: actions/upload-artifact@v4
        with:
          name: body-tracking-models-frame
          path: body-tracking-models-frame.tar.gz
          if-no-files-found: error
          retention-days: 7

  merge-package:
    name: merge runtime / Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    needs:
      - plan-linux
      - build-part
      - build-xrizer
    if: ${{ !cancelled() && needs.plan-linux.result == 'success' && needs.build-part.result == 'success' && (needs.build-xrizer.result == 'success' || needs.build-xrizer.result == 'skipped') }}
    env:
      XR_BUILD_CPU: ${{ matrix.target.cpu }}
      XR_RELEASE_ARCH: ${{ matrix.target.arch }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        target: ${{ fromJSON(needs.plan-linux.outputs.targets) }}

    steps:
      - name: Checkout profiles for package validation
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download partial packages
        uses: actions/download-artifact@v4
        with:
          pattern: xr-gate-merge-input-ubuntu-${{ matrix.ubuntu }}-${{ matrix.target.arch }}-*
          path: partials
          merge-multiple: false

      - name: Merge partial packages
        run: |
          set -euo pipefail
          case "$XR_BUILD_CPU" in
            generic) expected_cpu=x86-64 ;;
            avx2) expected_cpu=x86-64-v3 ;;
            avx512) expected_cpu=x86-64-v4 ;;
            native) expected_cpu=native ;;
            aarch64) expected_cpu=armv8-a ;;
            *) echo "Unknown CPU profile: $XR_BUILD_CPU" >&2; exit 2 ;;
          esac
          mkdir -p merged
          mapfile -t archives < <(find partials -type f -name 'xr-gate_*.tar.gz' | sort)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            echo "merge $archive"
            actual_cpu="$(tar -xOzf "$archive" xr-gate/BUILD_CPU_TARGET)"
            if [[ "$actual_cpu" != "$expected_cpu" ]]; then
              printf 'CPU target mismatch in %s: expected %s, got %s\n' "$archive" "$expected_cpu" "$actual_cpu" >&2
              exit 1
            fi
            tar -xzf "$archive" -C merged
          done
          test -d merged/xr-gate/bin
          test -x merged/xr-gate/run_xr_client.sh
          test -x merged/xr-gate/bin/capture_service_cpp/capture_tcp_probe
          test -x merged/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service.sh
          test -x merged/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          test -x merged/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
          test -x merged/xr-gate/devices/xreal_ultra/linux/scripts/xreal_display_helper/start_xreal_helper_60hz.sh
          if [[ "$XR_BUILD_VENDOR_COMPONENTS" == "1" ]]; then
            test -x merged/xr-gate/bin/xreal_display_helper/xreal_display_helper
          else
            test ! -e merged/xr-gate/bin/xreal_display_helper/xreal_display_helper
          fi
          test -f merged/xr-gate/LICENSE
          test -f merged/xr-gate/LICENSES/MIT.txt
          test -f merged/xr-gate/THIRD_PARTY_NOTICES.md
          test -f merged/xr-gate/BUILD_CPU_PROFILE.json
          test "$(cat merged/xr-gate/BUILD_OPENCV_LINKAGE)" = static-4.10.0
          test -f merged/xr-gate/bin/opencv/licenses/OpenCV-LICENSE.txt
          test -x merged/xr-gate/bin/backends/frame_body_tracking/frame_body_tracking_backend
          if [[ "$XR_BUILD_XRIZER" == "1" ]]; then
            test -d merged/xr-gate/bin/drivers/xrizer/runtime
            test -f merged/xr-gate/LICENSES/GPL-3.0-or-later.txt
            test -f merged/xr-gate/SOURCES/xrizer/SOURCE.txt
            test -f merged/xr-gate/SOURCES/xrizer/SHA256SUMS.txt
            MERGED_SOURCE="$(find merged/xr-gate/SOURCES/xrizer -maxdepth 1 -type f \
              -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
            test -n "$MERGED_SOURCE"
            test -f "$MERGED_SOURCE"
          else
            test ! -e merged/xr-gate/bin/drivers/xrizer
            test ! -e merged/xr-gate/LICENSES/GPL-3.0-or-later.txt
            test ! -e merged/xr-gate/SOURCES/xrizer
          fi
          test -f merged/xr-gate/bin/python/xr_client/configs/xreal_ultra.json
          test -f merged/xr-gate/bin/python/xr_client/configs/leap_motion_uvc_nrf54l15.json
          test -f merged/xr-gate/bin/python/xr_client/configs/leap_motion_uvc.json
          cmp runtime_adapters/xr_runtime_adapter/configs/emulation-controller.json \
            merged/xr-gate/runtime_adapters/xr_runtime_adapter/configs/emulation-controller.json
          for target in xreal_ultra leap_motion_uvc leap_motion_uvc_nrf54l15; do
            expected="devices/$target/configs/xr_runtime_adapter/emulation-controller.json"
            if [[ ! -f "$expected" ]]; then
              expected="runtime_adapters/xr_runtime_adapter/configs/emulation-controller.json"
            fi
            cmp "$expected" "merged/xr-gate/devices/$target/configs/xr_runtime_adapter/emulation-controller.json"
          done
          test -d merged/xr-gate/devices/leap_motion_uvc_nrf54l15
          test -d merged/xr-gate/devices/leap_motion_uvc
          test -x merged/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
          test -x merged/xr-gate/devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
          test ! -e merged/xr-gate/devices/common/linux/scripts/build
          test ! -e merged/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
          test ! -e merged/xr-gate/devices/xreal_ultra/linux/scripts/capture_service
          test ! -e merged/xr-gate/devices/xreal_ultra/linux/scripts/xr_spatial
          du -sh merged/xr-gate
          find merged/xr-gate -maxdepth 4 -type f | sort | sed -n '1,300p'
          printf '%s\n' '${{ matrix.ubuntu }}' > merged/xr-gate/BUILD_UBUNTU_VERSION
          # A venv embeds build-machine paths; the installer recreates it on the target.
          rm -rf merged/xr-gate/bin/python-runtime/venv
          # Validate in the target distro with runtime packages only, before archiving.
          bash merged/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu.sh --no-device-access
          rm -rf merged/xr-gate/bin/python-runtime/venv
          archive="xr-gate-ubuntu-${{ matrix.ubuntu }}-linux-$XR_RELEASE_ARCH.tar.gz"
          tar -C merged -czf "$archive" xr-gate
          ls -lh "$archive"

      - name: Smoke test generic binaries without AVX
        if: ${{ env.XR_BUILD_CPU == 'generic' && matrix.ubuntu == '24.04' }}
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends qemu-user
          # Conroe has no AVX/AVX2/FMA. Exercise startup and linked libraries.
          qemu-x86_64 -cpu Conroe merged/xr-gate/bin/capture_service_cpp/capture_tcp_probe --help >/dev/null
          qemu-x86_64 -cpu Conroe merged/xr-gate/bin/backends/basalt_vio/capture_basalt_backend --help >/dev/null
          qemu-x86_64 -cpu Conroe merged/xr-gate/bin/backends/frame_body_tracking/frame_body_tracking_backend --help >/dev/null

      - name: Upload merged package
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-ubuntu-${{ matrix.ubuntu }}-linux-${{ env.XR_RELEASE_ARCH }}
          path: xr-gate-ubuntu-${{ matrix.ubuntu }}-linux-${{ env.XR_RELEASE_ARCH }}.tar.gz
          retention-days: 7


  check-24-on-26:
    name: Ubuntu 24.04 runtime on Ubuntu 26.04 / ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    container: ubuntu:26.04
    needs: [plan-linux, merge-package]
    # The optional xrizer job may be skipped upstream of a successful merge.
    # Use a status function to override the implicit success() dependency gate.
    if: ${{ !cancelled() && needs.plan-linux.result == 'success' && needs.merge-package.result == 'success' }}
    env:
      XR_RELEASE_ARCH: ${{ matrix.target.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan-linux.outputs.targets) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xr-gate-ubuntu-24.04-linux-${{ env.XR_RELEASE_ARCH }}
      - name: Check cross-version runtime dependencies
        run: |
          set -euo pipefail
          tar -xzf "xr-gate-ubuntu-24.04-linux-$XR_RELEASE_ARCH.tar.gz"
          bash xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu.sh --no-device-access
          xr-gate/bin/capture_service_cpp/capture_tcp_probe --help >/dev/null
          xr-gate/bin/backends/basalt_vio/capture_basalt_backend --help >/dev/null

  build-steamvr-windows:
    name: Windows WPF launcher and SteamVR drivers
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_windows_driver }}
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Resolve the Ubuntu runtime release used by the Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_UBUNTU: ${{ inputs.build_ubuntu_amd64 }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          & ./win/ci/Resolve-RuntimeRelease.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify installer and driver contracts on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./win/tests/verify-env.ps1
          & ./win/tests/verify-steamvr-paths.ps1
          & ./win/tests/verify-runtime-contracts.ps1
          & ./win/tests/verify-driver-devices.ps1
          & ./win/tests/verify-bluetooth-firmware.ps1
          & ./win/tests/verify-bluetooth-selection.ps1
          & ./win/tests/verify-usb-timeout.ps1
          & ./win/tests/verify-device-lifecycle.ps1
          & ./win/tests/verify-setup-display.ps1
          & ./win/tests/verify-display-modes.ps1
          & ./win/tests/verify-release-platforms.ps1
          & ./win/tests/verify-runtime-sources.ps1
      - name: Test Bluetooth side selection and configuration updates
        run: python -m unittest discover -s win/tests -p 'test_bluetooth_controllers.py'
      - name: Verify partial TCP streams have a total deadline
        run: python -m unittest discover -s win/tests -p 'test_windows_contracts.py'
      - name: Publish and smoke-test self-contained WPF launcher
        run: '& ./win/launcher/build.ps1 -OutputDirectory ./out/windows-launcher'
      - name: Validate Windows driver selection
        run: |
          $ErrorActionPreference = 'Stop'
          $frequencies = @($env:XR_WINDOWS_OPENVR_BUILD_FREQUENCIES -split '[\s,;]+' | Where-Object { $_ } | Select-Object -Unique)
          $modes = @($env:XR_WINDOWS_OPENVR_BUILD_MODES -split '[\s,;]+' | Where-Object { $_ } | Select-Object -Unique)
          if (!$frequencies.Count -or !$modes.Count) { throw 'Select at least one Windows OpenVR frequency and mode.' }
          # Automatic driver selection always needs the requested 60 Hz fallback.
          if ($frequencies -notcontains '60') { $frequencies += '60' }
          foreach ($frequency in $frequencies) {
            if ($frequency -cnotmatch '^[1-9][0-9]{0,3}$' -or [int]$frequency -gt 1000) {
              throw "Invalid Windows OpenVR frequency '$frequency'; use integer Hz values from 1 to 1000."
            }
          }
          foreach ($mode in $modes) {
            if (@('direct', 'extended_sbs') -cnotcontains $mode) {
              throw "Invalid Windows OpenVR mode '$mode'; use direct or extended_sbs."
            }
          }
          "XR_WINDOWS_OPENVR_BUILD_FREQUENCIES=$($frequencies -join ' ')" >> $env:GITHUB_ENV
          "XR_WINDOWS_OPENVR_BUILD_MODES=$($modes -join ' ')" >> $env:GITHUB_ENV
          "Windows driver frequencies: $($frequencies -join ', ')" >> $env:GITHUB_STEP_SUMMARY
          "Windows driver modes: $($modes -join ', ')" >> $env:GITHUB_STEP_SUMMARY
      - name: OpenVR SDK (same pinned commit as Linux driver)
        uses: actions/checkout@v6
        with:
          repository: ValveSoftware/openvr
          ref: 0924064316de3effbcd1acf1e309182a2deb1c05
          path: .build-deps/openvr
      - name: JSON parser (header-only)
        uses: actions/checkout@v6
        with:
          repository: nlohmann/json
          ref: v3.11.3
          path: .build-deps/json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build, test driver functionality, and package Windows drivers
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $sdk = Join-Path $root '.build-deps/openvr'
          $json = Join-Path $root '.build-deps/json/single_include'
          $builder = Join-Path $root 'drivers/openvr_driver/scripts/windows/build_driver.ps1'
          $dist = Join-Path $root 'dist-windows'
          $drivers = Join-Path $dist 'drivers'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $deviceJson = & python (Join-Path $root 'drivers/device_profiles.py') --driver steamvr --json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot discover configured SteamVR devices' }
          $devices = @($deviceJson | ConvertFrom-Json)
          if (!$devices.Count) { throw 'No configured SteamVR devices' }
          $tested = $false
          foreach ($device in $devices) {
            $build = Join-Path $root "build/drivers/openvr_driver/$device/windows_Release"
            foreach ($frequency in ($env:XR_WINDOWS_OPENVR_BUILD_FREQUENCIES -split ' ')) {
              foreach ($mode in ($env:XR_WINDOWS_OPENVR_BUILD_MODES -split ' ')) {
                & $builder -Root $root -OpenVrSdkRoot $sdk -NlohmannJsonInclude $json `
                  -Generator Ninja -BuildType Release -Device $device -OutputRoot $drivers `
                  -DisplayFrequency $frequency -DisplayMode $mode -RuntimeTransport tcp -BuildTests
                if (!$tested) {
                  ctest --test-dir $build -C Release --output-on-failure
                  if ($LASTEXITCODE -ne 0) { throw 'Windows OpenVR driver functional tests failed' }
                  $tested = $true
                }
                $package = Join-Path $drivers "$device/${frequency}Hz-$mode/xr_tracking"
                $dll = Join-Path $package 'bin/win64/driver_xr_tracking.dll'
                $exports = & dumpbin.exe /exports $dll
                if ($LASTEXITCODE -ne 0 -or !($exports | Select-String 'HmdDriverFactory')) { throw 'Driver entry point missing' }
                if (!(Test-Path (Join-Path $package 'bin/win64/openvr_api.dll'))) { throw 'OpenVR runtime DLL missing' }
                $settings = Join-Path $package 'resources/settings/default.vrsettings'
                python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8"))["xr_tracking"]; assert d["deviceProfile"]==sys.argv[2]; assert all(d[k]=="tcp" for k in ("runtimePoseTransport","runtimeHandTransport","runtimeControllerStateTransport"))' $settings $device
                if ($LASTEXITCODE -ne 0) { throw 'Windows package has unexpected device/transport defaults' }
              }
            }
          }
          python win/package_windows.py build --drivers-root $drivers `
            --launcher-exe (Join-Path $root 'out/windows-launcher/XR-Gate.exe') `
            --output (Join-Path $dist 'xr-gate-windows-wsl2-usbip.zip') `
            --frequencies $env:XR_WINDOWS_OPENVR_BUILD_FREQUENCIES `
            --modes $env:XR_WINDOWS_OPENVR_BUILD_MODES --release-tag $env:WINDOWS_BUNDLE_RELEASE `
            --devices ($devices -join ' ')
          if ($LASTEXITCODE -ne 0) { throw 'Windows bundle packaging failed' }
      - name: Upload Windows installer and SteamVR drivers
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-windows-wsl2-usbip
          path: |
            dist-windows/xr-gate-windows-wsl2-usbip.zip
            dist-windows/xr-gate-windows-wsl2-usbip.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - plan-linux
      - release-unpack-helper
      - hand-tracking-models-mercury
      - body-tracking-models-frame
      - merge-package
      - check-24-on-26
      - merge-riscv64
      - build-steamvr-windows
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.publish_release == true ||
          github.event.inputs.publish_release == 'true'
        ) &&
        needs.plan-linux.result == 'success' &&
        (needs.plan-linux.outputs.release_arches != '' || inputs.release_windows_driver) &&
        (needs.plan-linux.outputs.release_arches == '' || (
          needs.release-unpack-helper.result == 'success' &&
          needs.hand-tracking-models-mercury.result == 'success' &&
          needs.body-tracking-models-frame.result == 'success'
        )) &&
        (needs.plan-linux.outputs.targets == '[]' || (
          needs.merge-package.result == 'success' &&
          needs.check-24-on-26.result == 'success'
        )) &&
        (needs.plan-linux.outputs.riscv_targets == '[]' || needs.merge-riscv64.result == 'success') &&
        (inputs.release_windows_driver == false || needs.build-steamvr-windows.result == 'success')
      }}
    env:
      XR_BUILD_UBUNTU_RELEASE: ${{ needs.plan-linux.outputs.release_arches != '' && '1' || '0' }}
      XR_BUILD_XRIZER: ${{ needs.plan-linux.outputs.targets != '[]' && inputs.include_xrizer && '1' || '0' }}
      XR_RELEASE_ARCHES: ${{ needs.plan-linux.outputs.release_arches }}
      XR_RELEASE_CPU_PROFILES: ${{ needs.plan-linux.outputs.cpu_profiles }}
      XR_RELEASE_RISCV_UBUNTU: ${{ needs.plan-linux.outputs.riscv_ubuntu_versions }}
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6

      - name: Download merged runtime packages
        if: ${{ env.XR_BUILD_UBUNTU_RELEASE == '1' }}
        uses: actions/download-artifact@v4
        with:
          pattern: xr-gate-ubuntu-*-linux-*
          merge-multiple: true
          path: release-assets/runtime

      - name: Download Mercury hand-tracking models
        if: ${{ env.XR_BUILD_UBUNTU_RELEASE == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: hand-tracking-models-mercury
          path: release-assets/models

      - name: Download Windows installer and SteamVR drivers
        if: ${{ env.XR_RELEASE_WINDOWS_DRIVER == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: xr-gate-windows-wsl2-usbip
          path: release-assets/windows

      - name: Download FRAME body-tracking model
        if: ${{ env.XR_BUILD_UBUNTU_RELEASE == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: body-tracking-models-frame
          path: release-assets/models

      - name: Download unpack helper
        if: ${{ env.XR_BUILD_UBUNTU_RELEASE == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: unpack-xr-gate
          path: release-assets/unpack-helper

      - name: Download xrizer Corresponding Source
        if: ${{ env.XR_BUILD_XRIZER == '1' }}
        uses: actions/download-artifact@v4
        with:
          pattern: xrizer-corresponding-source-ubuntu-*-*
          merge-multiple: false
          path: release-assets/xrizer-source

      - name: Validate release assets
        run: |
          set -euo pipefail

          find release-assets -maxdepth 5 -type f -print -exec ls -lh {} \;

          if [[ "$XR_BUILD_UBUNTU_RELEASE" == "1" ]]; then
            test -f release-assets/models/hand-tracking-models-mercury.tar.gz
            test -f release-assets/models/body-tracking-models-frame.tar.gz
            test -f release-assets/unpack-helper/unpack_xr_gate.sh
          fi
          if [[ "$XR_RELEASE_WINDOWS_DRIVER" == "1" ]]; then
            test -f release-assets/windows/xr-gate-windows-wsl2-usbip.zip
            test -f release-assets/windows/xr-gate-windows-wsl2-usbip.zip.sha256
            (cd release-assets/windows && sha256sum -c xr-gate-windows-wsl2-usbip.zip.sha256)
            python3 win/package_windows.py verify release-assets/windows/xr-gate-windows-wsl2-usbip.zip \
              --frequencies "$XR_WINDOWS_OPENVR_BUILD_FREQUENCIES" --modes "$XR_WINDOWS_OPENVR_BUILD_MODES"
          fi

          [[ "$XR_BUILD_UBUNTU_RELEASE" == "1" ]] || exit 0
          for arch in $XR_RELEASE_ARCHES; do
            ubuntu_versions=(24.04 26.04)
            case "$arch" in
              x64) expected_machine="Advanced Micro Devices X86-64" ;;
              arm64) expected_machine="AArch64" ;;
              riscv64) expected_machine="RISC-V"; read -r -a ubuntu_versions <<< "$XR_RELEASE_RISCV_UBUNTU" ;;
              *) echo "Unknown release architecture: $arch" >&2; exit 2 ;;
            esac
            for ubuntu in "${ubuntu_versions[@]}"; do
              rm -rf verify/runtime
              mkdir -p verify/runtime
              tar -xzf "release-assets/runtime/xr-gate-ubuntu-${ubuntu}-linux-$arch.tar.gz" -C verify/runtime

              test "$(cat verify/runtime/xr-gate/BUILD_UBUNTU_VERSION)" = "$ubuntu"
              test -d verify/runtime/xr-gate/bin
              test -x verify/runtime/xr-gate/run_xr_client.sh
              test -x verify/runtime/xr-gate/bin/capture_service_cpp/capture_tcp_probe
              LC_ALL=C readelf -h verify/runtime/xr-gate/bin/capture_service_cpp/capture_tcp_probe \
                | grep -Eq "Machine:[[:space:]]+${expected_machine}$"
              test -x verify/runtime/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service.sh
              test -x verify/runtime/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
              test -x verify/runtime/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
              test -x verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/xreal_display_helper/start_xreal_helper_60hz.sh
              if [[ "$XR_BUILD_VENDOR_COMPONENTS" == "1" ]]; then
                test -x verify/runtime/xr-gate/bin/xreal_display_helper/xreal_display_helper
              else
                test ! -e verify/runtime/xr-gate/bin/xreal_display_helper/xreal_display_helper
              fi
              test -f verify/runtime/xr-gate/LICENSE
              test -f verify/runtime/xr-gate/LICENSES/MIT.txt
              test -f verify/runtime/xr-gate/THIRD_PARTY_NOTICES.md
              if [[ "$XR_BUILD_XRIZER" == "1" && "$arch" != riscv64 ]]; then
                test -d verify/runtime/xr-gate/bin/drivers/xrizer/runtime
                test -f verify/runtime/xr-gate/LICENSES/GPL-3.0-or-later.txt
                test -f verify/runtime/xr-gate/SOURCES/xrizer/SOURCE.txt
                test -f verify/runtime/xr-gate/SOURCES/xrizer/SHA256SUMS.txt
                RUNTIME_SOURCE="$(find verify/runtime/xr-gate/SOURCES/xrizer -maxdepth 1 -type f \
                  -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
                RELEASE_SOURCE="$(find "release-assets/xrizer-source/xrizer-corresponding-source-ubuntu-${ubuntu}-${arch}" -maxdepth 2 -type f \
                  -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
                test -n "$RUNTIME_SOURCE"
                test -n "$RELEASE_SOURCE"
                cmp "$RUNTIME_SOURCE" "$RELEASE_SOURCE"
              else
                test ! -e verify/runtime/xr-gate/bin/drivers/xrizer
                test ! -e verify/runtime/xr-gate/LICENSES/GPL-3.0-or-later.txt
                test ! -e verify/runtime/xr-gate/SOURCES/xrizer
              fi
              test -f verify/runtime/xr-gate/bin/python/xr_client/configs/xreal_ultra.json
              test -f verify/runtime/xr-gate/bin/python/xr_client/configs/leap_motion_uvc_nrf54l15.json
              test -f verify/runtime/xr-gate/bin/python/xr_client/configs/leap_motion_uvc.json
              cmp runtime_adapters/xr_runtime_adapter/configs/emulation-controller.json \
                verify/runtime/xr-gate/runtime_adapters/xr_runtime_adapter/configs/emulation-controller.json
              for target in xreal_ultra leap_motion_uvc leap_motion_uvc_nrf54l15; do
                expected="devices/$target/configs/xr_runtime_adapter/emulation-controller.json"
                if [[ ! -f "$expected" ]]; then
                  expected="runtime_adapters/xr_runtime_adapter/configs/emulation-controller.json"
                fi
                cmp "$expected" "verify/runtime/xr-gate/devices/$target/configs/xr_runtime_adapter/emulation-controller.json"
              done
              test -d verify/runtime/xr-gate/devices/leap_motion_uvc_nrf54l15
              test -d verify/runtime/xr-gate/devices/leap_motion_uvc
              test -x verify/runtime/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
              test -x verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
              test ! -e verify/runtime/xr-gate/devices/common/linux/scripts/build
              test ! -e verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
              test ! -e verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/capture_service
              test ! -e verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/xr_spatial
            done
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.release_prerelease }}
        run: |
          set -euo pipefail

          ASSETS=()
          notes="XR Gate. Ubuntu release: $XR_BUILD_UBUNTU_RELEASE. Windows WSL/USB-IP release with SteamVR driver: $XR_RELEASE_WINDOWS_DRIVER."
          if [[ "$XR_BUILD_UBUNTU_RELEASE" == "1" ]]; then
            notes+=" Linux CPU profiles: $XR_RELEASE_CPU_PROFILES."
            for arch in $XR_RELEASE_ARCHES; do
              ubuntu_versions=(24.04 26.04)
              if [[ "$arch" == riscv64 ]]; then
                read -r -a ubuntu_versions <<< "$XR_RELEASE_RISCV_UBUNTU"
              fi
              for ubuntu in "${ubuntu_versions[@]}"; do
                ASSETS+=("release-assets/runtime/xr-gate-ubuntu-${ubuntu}-linux-$arch.tar.gz")
              done
            done
            ASSETS+=(
              release-assets/models/hand-tracking-models-mercury.tar.gz
              release-assets/models/body-tracking-models-frame.tar.gz
              release-assets/unpack-helper/unpack_xr_gate.sh
            )
          fi
          if [[ "$XR_RELEASE_WINDOWS_DRIVER" == "1" ]]; then
            ASSETS+=(release-assets/windows/xr-gate-windows-wsl2-usbip.zip release-assets/windows/xr-gate-windows-wsl2-usbip.zip.sha256)
          fi
          if [[ "$XR_BUILD_XRIZER" == "1" ]]; then
            for arch in $XR_RELEASE_ARCHES; do
              [[ "$arch" != riscv64 ]] || continue
              for ubuntu in 24.04 26.04; do
                source_dir="release-assets/xrizer-source/xrizer-corresponding-source-ubuntu-${ubuntu}-${arch}"
                source_archive="$(find "$source_dir" -maxdepth 2 -type f -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
                test -n "$source_archive"
                suffix=""
                [[ "$arch" == x64 ]] || suffix="-linux-$arch"
                asset="release-assets/xrizer-corresponding-source-ubuntu-${ubuntu}${suffix}.tar.gz"
                cp "$source_archive" "$asset"
                ASSETS+=("$asset")
              done
            done
          fi

          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "XR Gate $TAG" \
              --notes "$notes" \
              "${args[@]}"
          fi
