name: XR Gate split build

"on":
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ubuntu_release:
        description: "Build ubuntu release"
        type: boolean
        required: false
        default: true
      cpu_profile:
        description: "Native CPU target (native requires consistent builder CPUs)"
        type: choice
        options: [avx2, avx512, native]
        required: false
        default: avx2
      openvr_frequencies:
        description: "Linux OpenVR driver frequencies to build"
        required: false
        default: "60 90"
      openvr_modes:
        description: "Linux OpenVR driver modes to build"
        required: false
        default: "direct"
      windows_openvr_frequencies:
        description: "Windows OpenVR driver frequencies to build (for example 60 90)"
        type: string
        required: false
        default: "60 90"
      windows_openvr_modes:
        description: "Windows OpenVR driver modes to build (direct, extended_sbs)"
        type: string
        required: false
        default: "direct extended_sbs"
      include_xrizer:
        description: "Build optional xrizer GPL component with license and Corresponding Source"
        type: boolean
        required: false
        default: false
      include_vendor_components:
        description: "Build pure vendor components such as xreal_display_helper"
        type: boolean
        required: false
        default: true
      upload_partial_artifacts:
        description: "Upload each partial out package, not only the merged package"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload final artifacts to a GitHub Release"
        type: boolean
        required: false
        default: false
      release_windows_driver:
        description: "Build windows release (includes SteamVR driver)"
        type: boolean
        required: false
        default: true
      release_tag:
        description: "Release tag, for example v0.1.0"
        type: string
        required: false
        default: "v0.1.0"
      release_prerelease:
        description: "Mark release as prerelease"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: xr-gate-split-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  XR_BUILD_CPU: ${{ github.event_name == 'workflow_dispatch' && inputs.cpu_profile || 'avx2' }}
  XR_BUILD_CAPTURE_SERVICE_PYTHON: "0"
  XR_DOWNLOAD_HAND_TRACKING_MODELS: "0"
  XR_BUILD_XRIZER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ubuntu_release && inputs.include_xrizer && '1' || '0' }}
  XR_BUILD_VENDOR_COMPONENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_vendor_components == false && '0' || '1' }}
  XR_OPENVR_BUILD_FREQUENCIES: ${{ github.event_name == 'workflow_dispatch' && inputs.openvr_frequencies || '60 90' }}
  XR_OPENVR_BUILD_MODES: ${{ github.event_name == 'workflow_dispatch' && inputs.openvr_modes || 'direct' }}
  # Every Windows package includes the automatic selection's 60 Hz fallback.
  XR_WINDOWS_OPENVR_BUILD_FREQUENCIES: ${{ format('60 {0}', github.event_name == 'workflow_dispatch' && inputs.windows_openvr_frequencies || '60 90') }}
  XR_WINDOWS_OPENVR_BUILD_MODES: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_openvr_modes || 'direct extended_sbs' }}
  XR_RELEASE_WINDOWS_DRIVER: ${{ github.event_name == 'workflow_dispatch' && inputs.release_windows_driver && '1' || '0' }}
  XR_BUILD_UBUNTU_RELEASE: ${{ github.event_name != 'workflow_dispatch' && '1' || inputs.build_ubuntu_release && '1' || '0' }}

defaults:
  run:
    shell: bash

jobs:

  dispatch-info:
    name: workflow dispatch parameters
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 5
    steps:
      - name: Print workflow inputs
        env:
          TYPED_INPUTS: ${{ toJSON(inputs) }}
          EVENT_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail

          {
            echo "## Workflow dispatch inputs"
            echo
            echo "### Typed inputs"
            echo '```json'
            echo "$TYPED_INPUTS"
            echo '```'
            echo
            echo "### Event inputs"
            echo '```json'
            echo "$EVENT_INPUTS"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-unpack-helper:
    name: release unpack helper
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ubuntu_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and build standalone unpack helper
        run: |
          set -euo pipefail
          test -x devices/common/linux/scripts/release/unpack_xr_gate.sh
          test -x devices/common/linux/scripts/release/unpack_device_release.sh
          bash -n devices/common/linux/scripts/release/unpack_xr_gate.sh
          bash -n devices/common/linux/scripts/release/unpack_device_release.sh

          mkdir -p release-helper
          {
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail'
            printf '%s\n' \
              'export XR_RELEASE_DEVICE_TARGET="xr-gate"' \
              'export XR_RELEASE_DEVICE_DISPLAY_NAME="XR Gate"' \
              'export XR_RELEASE_REQUIRE_DEVICE="0"'
            tail -n +3 devices/common/linux/scripts/release/unpack_device_release.sh
          } > release-helper/unpack_xr_gate.sh
          chmod +x release-helper/unpack_xr_gate.sh
          bash -n release-helper/unpack_xr_gate.sh
          release-helper/unpack_xr_gate.sh --help | grep -F 'XR Gate'
          ls -lh release-helper/unpack_xr_gate.sh

      - name: Upload unpack helper
        uses: actions/upload-artifact@v4
        with:
          name: unpack-xr-gate
          path: release-helper/unpack_xr_gate.sh
          if-no-files-found: error
          retention-days: 7

  build-opencv:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ubuntu_release }}
    name: OpenCV SDK / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - name: Bootstrap OpenCV build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build python3 ccache nasm
      - uses: actions/checkout@v6
      - name: Build static OpenCV once for this CPU profile and run
        env:
          XR_OPENCV_PREFIX: ${{ github.workspace }}/opencv-sdk
        run: bash devices/common/linux/scripts/build/build_opencv.sh
      - name: Archive current-run SDK
        run: tar -czf opencv-sdk.tar.gz opencv-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: opencv-sdk-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-${{ matrix.ubuntu }}-${{ env.XR_BUILD_CPU }}
          path: opencv-sdk.tar.gz
          retention-days: 1
          compression-level: 0

  build-part:
    name: build ${{ matrix.component.name }} / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    needs: build-opencv
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        component:
          - name: capture
            build_only: "capture_service_cpp xreal_display_helper"
          - name: runtime
            build_only: "imu_3dof xr_runtime_adapter override_controller xr_video bridges"
          - name: spatial
            build_only: "xr_spatial"
          - name: steamvr
            build_only: "openvr_driver steamvr_video_overlay steamvr_spatial_overlay steamvr_spatial_scene"
          - name: basalt
            build_only: "basalt_vio"
          - name: mercury
            build_only: "mercury_hand_tracking"
          - name: monado
            build_only: "monado_driver"

    steps:
      - name: Bootstrap build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git git-lfs ca-certificates
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = '${{ matrix.ubuntu }}'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Configure Git workspace trust in container
        run: |
          # checkout uses a temporary HOME for its safe.directory configuration.
          # Persist trust for this workspace in the configuration used by run steps.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Validate common build/package wrappers
        run: |
          set -euo pipefail
          scripts=(
            devices/common/linux/scripts/build/device_out_env.sh
            devices/common/linux/scripts/build/xr_gate_out_env.sh
            devices/common/linux/scripts/build/install_device_out.sh
            devices/common/linux/scripts/build/with_build_session.sh
            devices/common/linux/scripts/build/build_opencv.sh
            devices/common/linux/scripts/build/opencv_env.sh
            devices/common/linux/scripts/build/install_xr_gate_out.sh
            devices/common/linux/scripts/build/package_device_out.sh
            devices/common/linux/scripts/build/package_xr_gate_out.sh
            devices/common/linux/scripts/build/build_vendor_components.sh
            devices/common/linux/scripts/build/package_vendor_components.sh
            drivers/xrizer/scripts/linux/package_xrizer_compliance.sh
            devices/common/linux/scripts/ci/run_act_build.sh
            devices/common/linux/scripts/ci/run_xr_gate_act_build.sh
            devices/common/linux/scripts/release/unpack_device_release.sh
            devices/common/linux/scripts/release/unpack_xr_gate.sh
            devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
            devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
            devices/xreal_ultra/linux/scripts/package_xreal_ultra_out.sh
            devices/xreal_ultra/linux/scripts/run_xreal_ultra_act_build.sh
            devices/xreal_ultra/linux/scripts/unpack_xreal_ultra.sh
            devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
            devices/xreal_ultra/linux/scripts/install_xreal_ultra_device_access.sh
            devices/xreal_ultra/linux/scripts/build_xreal_ultra_components.sh
            devices/xreal_ultra/linux/scripts/package_xreal_ultra_components.sh
          )
          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
          done

      - name: Install base build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates curl wget tar unzip rsync jq file \
            build-essential cmake ninja-build pkg-config binutils ccache nasm \
            python3 python3-full python3-venv python3-pip \
            libopencv-dev libhidapi-dev libcli11-dev nlohmann-json3-dev \
            libeigen3-dev libboost-all-dev libceres-dev libtbb-dev \
            libfmt-dev libspdlog-dev
          git lfs install --local

      - name: Check native build orchestration
        if: ${{ matrix.component.name == 'basalt' }}
        run: python3 devices/common/linux/scripts/build/tests/test_native_build.py -v

      - name: Download OpenCV SDK from this run and attempt
        uses: actions/download-artifact@v4
        with:
          name: opencv-sdk-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-${{ matrix.ubuntu }}-${{ env.XR_BUILD_CPU }}
          path: .build-deps

      - name: Unpack current-run OpenCV SDK
        run: tar -xzf .build-deps/opencv-sdk.tar.gz -C .build-deps

      - name: Install SteamVR/OpenGL build packages
        if: ${{ matrix.component.name == 'steamvr' }}
        run: |
          sudo apt-get install -y --no-install-recommends \
            mesa-common-dev libopengl-dev libgl-dev libglx-dev libegl-dev \
            libvulkan-dev libsdl2-dev \
            libx11-dev libxrandr-dev libxext-dev libxfixes-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-present-dev \
            libxcb-dri3-dev libxcb-xfixes0-dev

      - name: Install Monado X11/XCB build packages
        if: ${{ matrix.component.name == 'monado' }}
        run: |
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev vulkan-tools glslang-tools \
            libx11-dev libx11-xcb-dev libxrandr-dev libxext-dev libxfixes-dev libxxf86vm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-present-dev \
            libxcb-dri3-dev libxcb-xfixes0-dev libxcb-keysyms1-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libudev-dev libhidapi-dev libsystemd-dev libdbus-1-dev

      - name: Build partial package
        env:
          XR_OUT_ROOT: ${{ github.workspace }}/out/xr-gate
          XR_BUILD_ONLY: ${{ matrix.component.build_only }}
          XR_PACKAGE_ALLOW_PARTIAL: "1"
          CLONE_OPENVR: "1"
          CLONE_MONADO: "1"
          BASALT_BUILD_JOBS: "2"
          XR_OPENCV_PREFIX: ${{ github.workspace }}/.build-deps/opencv-sdk
        run: |
          df -h
          ./devices/common/linux/scripts/build/install_xr_gate_out.sh
          du -sh out/xr-gate || true
          find out/xr-gate -maxdepth 4 -type f | sort | sed -n '1,200p'

      - name: Validate capture launchers and TCP metadata probe
        if: ${{ matrix.component.name == 'capture' }}
        run: |
          set -euo pipefail
          test -x out/xr-gate/bin/scripts/capture_service_cpp/start_capture_service_cpp.sh
          test -x out/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service_cpp.sh
          test -x out/xr-gate/bin/capture_service_cpp/capture_tcp_probe
          bash -n out/xr-gate/bin/scripts/capture_service_cpp/start_capture_service_cpp.sh
          bash -n out/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service_cpp.sh
          out/xr-gate/bin/capture_service_cpp/capture_tcp_probe --help >/dev/null

          if [[ "$XR_BUILD_VENDOR_COMPONENTS" == "1" ]]; then
            test -x out/xr-gate/bin/xreal_display_helper/xreal_display_helper
          else
            test ! -e out/xr-gate/bin/xreal_display_helper/xreal_display_helper
          fi

          READY_FILE="$(mktemp)"
          rm -f "$READY_FILE"
          export READY_FILE
          python3 - <<'PY' &
          import json
          import os
          import socket

          hello = json.dumps({
              "protocol": "capture_net_v1_json_payload",
              "namespace": "ci_capture",
              "profile": "leap_motion_uvc_nrf54l15",
              "streams": {},
          }, separators=(",", ":")).encode("utf-8")

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(("127.0.0.1", 45679))
              server.listen(1)
              open(os.environ["READY_FILE"], "w", encoding="utf-8").close()
              connection, _ = server.accept()
              with connection:
                  connection.sendall(f"CAPHELLO {len(hello)}\n".encode("ascii"))
                  connection.sendall(hello)
                  connection.recv(64)
          PY
          SERVER_PID=$!
          for _ in $(seq 1 50); do
            [[ -f "$READY_FILE" ]] && break
            sleep 0.1
          done
          test -f "$READY_FILE"
          PROFILE="$(out/xr-gate/bin/capture_service_cpp/capture_tcp_probe \
            --host 127.0.0.1 \
            --port 45679 \
            --timeout-ms 2000 \
            --print-profile)"
          wait "$SERVER_PID"
          rm -f "$READY_FILE"
          test "$PROFILE" = "leap_motion_uvc_nrf54l15"

      - name: Validate capture profile resolver
        if: ${{ matrix.component.name == 'runtime' }}
        run: |
          bash backends/common/tests/capture_profile_smoke.sh

      - name: Validate common/device script separation
        if: ${{ matrix.component.name == 'runtime' }}
        run: |
          set -euo pipefail
          test -x out/xr-gate/devices/common/linux/scripts/basalt_vio/start_basalt.sh
          test -x out/xr-gate/devices/common/linux/scripts/mercury_hand_tracking/start_hand_tracking.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/xreal_display_helper/start_xreal_helper_60hz.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/monado_driver/double_display_fix.sh
          test -x out/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
          test -x out/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_device_access.sh
          test ! -e out/xr-gate/devices/common/linux/scripts/build
          test ! -e out/xr-gate/devices/common/linux/scripts/ci
          test ! -e out/xr-gate/devices/common/linux/scripts/release
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/package_xreal_ultra_out.sh
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/basalt_vio
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/capture_service
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/xr_spatial
          test ! -e out/xr-gate/devices/xreal_ultra/linux/scripts/xr_video

      - name: Validate xr_spatial SHM/TCP launchers
        if: ${{ matrix.component.name == 'spatial' }}
        run: |
          set -euo pipefail
          test -x out/xr-gate/bin/backends/xr_spatial/xr_spatial_backend
          test -x out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_shm.sh
          test -x out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_tcp.sh
          test -x out/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
          test -x out/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_shm.sh
          test -x out/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          bash -n out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_shm.sh
          bash -n out/xr-gate/bin/scripts/backends/xr_spatial/start_xr_spatial_tcp.sh
          bash -n out/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
          bash -n out/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          HELP_FILE="$(mktemp)"
          trap 'rm -f "$HELP_FILE"' EXIT
          out/xr-gate/bin/backends/xr_spatial/xr_spatial_backend \
            --help >"$HELP_FILE" 2>&1
          grep -Fq -- '--capture-transport' "$HELP_FILE"
          grep -Fq -- '--capture-tcp-host' "$HELP_FILE"


      - name: Archive partial package
        run: |
          tar -C out -czf xr-gate_${{ matrix.component.name }}.tar.gz xr-gate
          ls -lh xr-gate_${{ matrix.component.name }}.tar.gz

      - name: Upload partial package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_partial_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-part-ubuntu-${{ matrix.ubuntu }}-${{ matrix.component.name }}
          path: xr-gate_${{ matrix.component.name }}.tar.gz
          retention-days: 3

      - name: Upload merge input
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-merge-input-ubuntu-${{ matrix.ubuntu }}-${{ matrix.component.name }}
          path: xr-gate_${{ matrix.component.name }}.tar.gz
          retention-days: 3


  build-xrizer:
    name: build optional xrizer / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    needs: build-opencv
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ubuntu_release && inputs.include_xrizer == true }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]

    steps:
      - name: Bootstrap build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git git-lfs ca-certificates
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = '${{ matrix.ubuntu }}'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Configure Git workspace trust in container
        run: |
          # checkout uses a temporary HOME for its safe.directory configuration.
          # Persist trust for this workspace in the configuration used by run steps.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel

      - name: Install xrizer build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates curl tar gzip rsync coreutils \
            build-essential pkg-config clang libclang-dev glslc \
            python3 python3-full python3-venv
          git lfs install --local

      - name: Download current CPU-profile OpenCV SDK
        uses: actions/download-artifact@v4
        with:
          name: opencv-sdk-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-${{ matrix.ubuntu }}-${{ env.XR_BUILD_CPU }}
          path: .build-deps

      - name: Unpack current-run SDK for native CPU validation
        run: tar -xzf .build-deps/opencv-sdk.tar.gz -C .build-deps

      - name: Build xrizer with GPL compliance material
        env:
          XR_OUT_ROOT: ${{ github.workspace }}/out/xr-gate
          XR_BUILD_ONLY: "xrizer"
          XR_BUILD_XRIZER: "1"
          XR_PACKAGE_ALLOW_PARTIAL: "1"
          XRIZER_PACKAGE_COMPLIANCE: "1"
          XRIZER_VENDOR_CARGO_SOURCES: "1"
          XRIZER_INSTALL_RUSTUP: "1"
          CLONE_XRIZER: "1"
          XR_OPENCV_PREFIX: ${{ github.workspace }}/.build-deps/opencv-sdk
        run: |
          set -euo pipefail
          ./devices/common/linux/scripts/build/install_xr_gate_out.sh

          XRIZER_PACKAGE="out/xr-gate/bin/drivers/xrizer"
          test -d "$XRIZER_PACKAGE/runtime"
          test -f "$XRIZER_PACKAGE/LICENSE.GPL-3.0-or-later"
          test -f "$XRIZER_PACKAGE/SOURCE.txt"
          test -f "$XRIZER_PACKAGE/SHA256SUMS.txt"
          test -f out/xr-gate/LICENSES/GPL-3.0-or-later.txt
          test -f out/xr-gate/SOURCES/xrizer/SOURCE.txt
          test -f out/xr-gate/SOURCES/xrizer/SHA256SUMS.txt

          SOURCE_ARCHIVE="$(find out/xr-gate/SOURCES/xrizer -maxdepth 1 -type f \
            -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
          test -n "$SOURCE_ARCHIVE"
          test -f "$SOURCE_ARCHIVE"
          tar -tzf "$SOURCE_ARCHIVE" > xrizer-source-files.txt
          grep -Fq '/SOURCE_INFO.txt' xrizer-source-files.txt
          grep -Fq '/BUILDING_XRIZER.md' xrizer-source-files.txt
          grep -Fq '/LICENSE' xrizer-source-files.txt
          grep -Fq '/vendor/' xrizer-source-files.txt
          (
            cd "$XRIZER_PACKAGE"
            sha256sum -c SHA256SUMS.txt
          )

          tar -C out -czf xr-gate_xrizer.tar.gz xr-gate
          ls -lh xr-gate_xrizer.tar.gz "$SOURCE_ARCHIVE"

      - name: Upload xrizer merge input
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-merge-input-ubuntu-${{ matrix.ubuntu }}-xrizer
          path: xr-gate_xrizer.tar.gz
          retention-days: 3

      - name: Upload xrizer Corresponding Source
        uses: actions/upload-artifact@v4
        with:
          name: xrizer-corresponding-source-ubuntu-${{ matrix.ubuntu }}
          path: out/xr-gate/SOURCES/xrizer/xrizer-corresponding-source-*.tar.gz
          if-no-files-found: error
          retention-days: 7


  hand-tracking-models-mercury:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ubuntu_release }}
    name: hand-tracking models Mercury
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Install download packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates curl tar coreutils rsync \
            python3 python3-venv
          git lfs install --local

      - name: Download Mercury hand-tracking models
        env:
          XR_OUT_ROOT: ${{ github.workspace }}/out/xr-gate
          XR_BUILD_ONLY: "hand_tracking_models"
          XR_PACKAGE_ALLOW_PARTIAL: "1"
          XR_DOWNLOAD_HAND_TRACKING_MODELS: "1"
          CLONE_MERCURY_DRIVER: "1"
          FETCH_MERCURY_DRIVER: "1"
          RESET_MERCURY_DRIVER_TREE: "1"
        run: |
          df -h
          ./devices/common/linux/scripts/build/install_xr_gate_out.sh

          MODEL_DIR="out/xr-gate/bin/hand-tracking-models/mercury"
          test -f "$MODEL_DIR/grayscale_detection_160x160.onnx"
          test -f "$MODEL_DIR/grayscale_keypoint_jan18.onnx"

          mkdir -p model_artifact/hand-tracking-models/mercury
          cp -a "$MODEL_DIR"/*.onnx model_artifact/hand-tracking-models/mercury/

          cat > model_artifact/hand-tracking-models/mercury/SOURCE.txt <<'EOF'
          Mercury hand-tracking ONNX models.

          Files:
            grayscale_detection_160x160.onnx
            grayscale_keypoint_jan18.onnx

          Upstream:
            https://github.com/moshimeow/mercury_steamvr_driver

          Pinned ref:
            e3948ace94a9f2cbd949adf50ffcc082002337cc

          License/notice:
            These ONNX model files are third-party artifacts and are not covered by
            the MIT license of the xr_tracking project. They remain under their
            upstream terms. Keep this notice with redistributed copies.

          Install into a downloaded XR Gate runtime package:
            tar -C out/xr-gate/bin -xzf hand-tracking-models-mercury.tar.gz
          EOF

          (
            cd model_artifact/hand-tracking-models/mercury
            sha256sum *.onnx > SHA256SUMS.txt
          )

          find model_artifact -type f -print -exec ls -lh {} \;
          tar -C model_artifact -czf hand-tracking-models-mercury.tar.gz hand-tracking-models
          ls -lh hand-tracking-models-mercury.tar.gz

      - name: Upload Mercury hand-tracking models
        uses: actions/upload-artifact@v4
        with:
          name: hand-tracking-models-mercury
          path: hand-tracking-models-mercury.tar.gz
          retention-days: 7

  merge-package:
    name: merge runtime / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    needs:
      - build-part
      - build-xrizer
    if: ${{ always() && needs.build-part.result == 'success' && (needs.build-xrizer.result == 'success' || needs.build-xrizer.result == 'skipped') }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]

    steps:
      - name: Download partial packages
        uses: actions/download-artifact@v4
        with:
          pattern: xr-gate-merge-input-ubuntu-${{ matrix.ubuntu }}-*
          path: partials
          merge-multiple: false

      - name: Merge partial packages
        run: |
          mkdir -p merged
          find partials -type f -name 'xr-gate_*.tar.gz' -print -exec ls -lh {} \;
          for archive in $(find partials -type f -name 'xr-gate_*.tar.gz' | sort); do
            echo "merge $archive"
            tar -xzf "$archive" -C merged
          done
          test -d merged/xr-gate/bin
          test -x merged/xr-gate/run_xr_client.sh
          test -x merged/xr-gate/bin/capture_service_cpp/capture_tcp_probe
          test -x merged/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service.sh
          test -x merged/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          test -x merged/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
          test -x merged/xr-gate/devices/xreal_ultra/linux/scripts/xreal_display_helper/start_xreal_helper_60hz.sh
          if [[ "$XR_BUILD_VENDOR_COMPONENTS" == "1" ]]; then
            test -x merged/xr-gate/bin/xreal_display_helper/xreal_display_helper
          else
            test ! -e merged/xr-gate/bin/xreal_display_helper/xreal_display_helper
          fi
          test -f merged/xr-gate/LICENSE
          test -f merged/xr-gate/LICENSES/MIT.txt
          test -f merged/xr-gate/THIRD_PARTY_NOTICES.md
          case "$XR_BUILD_CPU" in
            avx2) expected_cpu=x86-64-v3 ;;
            avx512) expected_cpu=x86-64-v4 ;;
            native) expected_cpu=native ;;
            *) echo "Unknown CPU profile: $XR_BUILD_CPU" >&2; exit 2 ;;
          esac
          test "$(cat merged/xr-gate/BUILD_CPU_TARGET)" = "$expected_cpu"
          test -f merged/xr-gate/BUILD_CPU_PROFILE.json
          test "$(cat merged/xr-gate/BUILD_OPENCV_LINKAGE)" = static-4.10.0
          test -f merged/xr-gate/bin/opencv/licenses/OpenCV-LICENSE.txt
          if [[ "$XR_BUILD_XRIZER" == "1" ]]; then
            test -d merged/xr-gate/bin/drivers/xrizer/runtime
            test -f merged/xr-gate/LICENSES/GPL-3.0-or-later.txt
            test -f merged/xr-gate/SOURCES/xrizer/SOURCE.txt
            test -f merged/xr-gate/SOURCES/xrizer/SHA256SUMS.txt
            MERGED_SOURCE="$(find merged/xr-gate/SOURCES/xrizer -maxdepth 1 -type f \
              -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
            test -n "$MERGED_SOURCE"
            test -f "$MERGED_SOURCE"
          else
            test ! -e merged/xr-gate/bin/drivers/xrizer
            test ! -e merged/xr-gate/LICENSES/GPL-3.0-or-later.txt
            test ! -e merged/xr-gate/SOURCES/xrizer
          fi
          test -f merged/xr-gate/bin/python/xr_client/configs/xreal_ultra.json
          test -f merged/xr-gate/bin/python/xr_client/configs/leap_motion_uvc_nrf54l15.json
          test -f merged/xr-gate/bin/python/xr_client/configs/leap_motion_uvc.json
          test -d merged/xr-gate/devices/leap_motion_uvc_nrf54l15
          test -d merged/xr-gate/devices/leap_motion_uvc
          test -x merged/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
          test -x merged/xr-gate/devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
          test ! -e merged/xr-gate/devices/common/linux/scripts/build
          test ! -e merged/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
          test ! -e merged/xr-gate/devices/xreal_ultra/linux/scripts/capture_service
          test ! -e merged/xr-gate/devices/xreal_ultra/linux/scripts/xr_spatial
          du -sh merged/xr-gate
          find merged/xr-gate -maxdepth 4 -type f | sort | sed -n '1,300p'
          printf '%s\n' '${{ matrix.ubuntu }}' > merged/xr-gate/BUILD_UBUNTU_VERSION
          # A venv embeds build-machine paths; the installer recreates it on the target.
          rm -rf merged/xr-gate/bin/python-runtime/venv
          # Validate in the target distro with runtime packages only, before archiving.
          bash merged/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu.sh --no-device-access
          rm -rf merged/xr-gate/bin/python-runtime/venv
          tar -C merged -czf xr-gate-ubuntu-${{ matrix.ubuntu }}-linux-x64.tar.gz xr-gate
          ls -lh xr-gate-ubuntu-${{ matrix.ubuntu }}-linux-x64.tar.gz

      - name: Upload merged package
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-ubuntu-${{ matrix.ubuntu }}-linux-x64
          path: xr-gate-ubuntu-${{ matrix.ubuntu }}-linux-x64.tar.gz
          retention-days: 7


  check-24-on-26:
    name: Ubuntu 24.04 runtime on Ubuntu 26.04
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: merge-package
    # The optional xrizer job may be skipped upstream of a successful merge.
    # Use a status function to override the implicit success() dependency gate.
    if: ${{ !cancelled() && needs.merge-package.result == 'success' }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xr-gate-ubuntu-24.04-linux-x64
      - name: Check cross-version runtime dependencies
        run: |
          set -euo pipefail
          tar -xzf xr-gate-ubuntu-24.04-linux-x64.tar.gz
          bash xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu.sh --no-device-access
          xr-gate/bin/capture_service_cpp/capture_tcp_probe --help >/dev/null
          xr-gate/bin/backends/basalt_vio/capture_basalt_backend --help >/dev/null

  build-steamvr-windows:
    name: Windows WPF launcher and SteamVR drivers
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_windows_driver }}
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Resolve the Ubuntu runtime release used by the Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_UBUNTU: ${{ inputs.build_ubuntu_release }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeTag = 'latest'
          if ($env:BUILD_UBUNTU -eq 'true' -and $env:PUBLISH_RELEASE -eq 'true') {
            $runtimeTag = $env:RELEASE_TAG
          } elseif ($env:BUILD_UBUNTU -ne 'true') {
            # A Windows-only release must not point its installer at itself:
            # it contains no Linux runtime/model assets. Pin a usable prior tag.
            $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
            $found = $null
            for ($page = 1; $page -le 10 -and !$found; $page++) {
              $releases = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page")
              if (!$releases.Count) { break }
              foreach ($release in $releases) {
                $names = @($release.assets | ForEach-Object { $_.name })
                if (!$release.draft -and 'xr-gate-ubuntu-24.04-linux-x64.tar.gz' -in $names -and
                    'hand-tracking-models-mercury.tar.gz' -in $names) { $found = $release; break }
              }
            }
            if (!$found) { throw 'No published Ubuntu runtime/models release exists. Enable Build ubuntu release and publish it first.' }
            $runtimeTag = [string]$found.tag_name
          }
          "WINDOWS_BUNDLE_RELEASE=$runtimeTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows installer runtime release: $runtimeTag"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify installer and driver contracts on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./win/tests/verify-env.ps1
          & ./win/tests/verify-steamvr-paths.ps1
          & ./win/tests/verify-runtime-contracts.ps1
          & ./win/tests/verify-bluetooth-firmware.ps1
          & ./win/tests/verify-bluetooth-selection.ps1
          & ./win/tests/verify-usb-timeout.ps1
          & ./win/tests/verify-device-lifecycle.ps1
          & ./win/tests/verify-release-platforms.ps1
      - name: Test Bluetooth side selection and configuration updates
        run: python -m unittest discover -s win/tests -p 'test_bluetooth_controllers.py'
      - name: Verify partial TCP streams have a total deadline
        run: python -m unittest discover -s win/tests -p 'test_windows_contracts.py'
      - name: Publish and smoke-test self-contained WPF launcher
        run: '& ./win/launcher/build.ps1 -OutputDirectory ./out/windows-launcher'
      - name: Validate Windows driver selection
        run: |
          $ErrorActionPreference = 'Stop'
          $frequencies = @($env:XR_WINDOWS_OPENVR_BUILD_FREQUENCIES -split '[\s,;]+' | Where-Object { $_ } | Select-Object -Unique)
          $modes = @($env:XR_WINDOWS_OPENVR_BUILD_MODES -split '[\s,;]+' | Where-Object { $_ } | Select-Object -Unique)
          if (!$frequencies.Count -or !$modes.Count) { throw 'Select at least one Windows OpenVR frequency and mode.' }
          # Automatic driver selection always needs the requested 60 Hz fallback.
          if ($frequencies -notcontains '60') { $frequencies += '60' }
          foreach ($frequency in $frequencies) {
            if ($frequency -cnotmatch '^[1-9][0-9]{0,3}$' -or [int]$frequency -gt 1000) {
              throw "Invalid Windows OpenVR frequency '$frequency'; use integer Hz values from 1 to 1000."
            }
          }
          foreach ($mode in $modes) {
            if (@('direct', 'extended_sbs') -cnotcontains $mode) {
              throw "Invalid Windows OpenVR mode '$mode'; use direct or extended_sbs."
            }
          }
          "XR_WINDOWS_OPENVR_BUILD_FREQUENCIES=$($frequencies -join ' ')" >> $env:GITHUB_ENV
          "XR_WINDOWS_OPENVR_BUILD_MODES=$($modes -join ' ')" >> $env:GITHUB_ENV
          "Windows driver frequencies: $($frequencies -join ', ')" >> $env:GITHUB_STEP_SUMMARY
          "Windows driver modes: $($modes -join ', ')" >> $env:GITHUB_STEP_SUMMARY
      - name: OpenVR SDK (same pinned commit as Linux driver)
        uses: actions/checkout@v6
        with:
          repository: ValveSoftware/openvr
          ref: 0924064316de3effbcd1acf1e309182a2deb1c05
          path: .build-deps/openvr
      - name: JSON parser (header-only)
        uses: actions/checkout@v6
        with:
          repository: nlohmann/json
          ref: v3.11.3
          path: .build-deps/json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build, test driver functionality, and package Windows drivers
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $sdk = Join-Path $root '.build-deps/openvr'
          $json = Join-Path $root '.build-deps/json/single_include'
          $builder = Join-Path $root 'drivers/openvr_driver/scripts/windows/build_driver.ps1'
          $build = Join-Path $root 'build/drivers/openvr_driver/windows_Release'
          $dist = Join-Path $root 'dist-windows'
          $drivers = Join-Path $dist 'drivers'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $tested = $false
          foreach ($frequency in ($env:XR_WINDOWS_OPENVR_BUILD_FREQUENCIES -split ' ')) {
            foreach ($mode in ($env:XR_WINDOWS_OPENVR_BUILD_MODES -split ' ')) {
              & $builder -Root $root -OpenVrSdkRoot $sdk -NlohmannJsonInclude $json `
                -Generator Ninja -BuildType Release -Device generic `
                -DisplayFrequency $frequency -DisplayMode $mode -RuntimeTransport tcp -BuildTests
              if (!$tested) {
                ctest --test-dir $build -C Release --output-on-failure
                if ($LASTEXITCODE -ne 0) { throw 'Windows OpenVR driver functional tests failed' }
                $tested = $true
              }
              $package = Join-Path $build 'xr_tracking'
              $dll = Join-Path $package 'bin/win64/driver_xr_tracking.dll'
              $exports = & dumpbin.exe /exports $dll
              if ($LASTEXITCODE -ne 0 -or !($exports | Select-String 'HmdDriverFactory')) { throw 'Driver entry point missing' }
              if (!(Test-Path (Join-Path $package 'bin/win64/openvr_api.dll'))) { throw 'OpenVR runtime DLL missing' }
              $settings = Join-Path $package 'resources/settings/default.vrsettings'
              python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8"))["xr_tracking"]; assert all(d[k]=="tcp" for k in ("runtimePoseTransport","runtimeHandTransport","runtimeControllerStateTransport")); assert d["runtimeTcpHost"]=="127.0.0.1" and d["runtimeTcpPort"]==45810' $settings
              if ($LASTEXITCODE -ne 0) { throw 'Windows package has unexpected transport defaults' }
              $variant = Join-Path $drivers "${frequency}Hz-${mode}"
              New-Item -ItemType Directory -Force $variant | Out-Null
              Copy-Item -LiteralPath $package -Destination $variant -Recurse -Force
            }
          }
          python win/package_windows.py build --drivers-root $drivers `
            --launcher-exe (Join-Path $root 'out/windows-launcher/XR-Gate.exe') `
            --output (Join-Path $dist 'xr-gate-windows-wsl-usbip.zip') `
            --frequencies $env:XR_WINDOWS_OPENVR_BUILD_FREQUENCIES `
            --modes $env:XR_WINDOWS_OPENVR_BUILD_MODES --release-tag $env:WINDOWS_BUNDLE_RELEASE
          if ($LASTEXITCODE -ne 0) { throw 'Windows bundle packaging failed' }
      - name: Upload Windows installer and SteamVR drivers
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-windows-wsl-usbip
          path: |
            dist-windows/xr-gate-windows-wsl-usbip.zip
            dist-windows/xr-gate-windows-wsl-usbip.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - release-unpack-helper
      - hand-tracking-models-mercury
      - merge-package
      - check-24-on-26
      - build-steamvr-windows
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.publish_release == true ||
          github.event.inputs.publish_release == 'true'
        ) &&
        (inputs.build_ubuntu_release || inputs.release_windows_driver) &&
        (!inputs.build_ubuntu_release || (
          needs.release-unpack-helper.result == 'success' &&
          needs.hand-tracking-models-mercury.result == 'success' &&
          needs.merge-package.result == 'success' &&
          needs.check-24-on-26.result == 'success'
        ))
        && (inputs.release_windows_driver == false || needs.build-steamvr-windows.result == 'success')
      }}
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6

      - name: Download merged runtime package
        if: ${{ env.XR_BUILD_UBUNTU_RELEASE == '1' }}
        uses: actions/download-artifact@v4
        with:
          pattern: xr-gate-ubuntu-*-linux-x64
          merge-multiple: true
          path: release-assets/runtime

      - name: Download Mercury hand-tracking models
        if: ${{ env.XR_BUILD_UBUNTU_RELEASE == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: hand-tracking-models-mercury
          path: release-assets/models

      - name: Download Windows installer and SteamVR drivers
        if: ${{ env.XR_RELEASE_WINDOWS_DRIVER == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: xr-gate-windows-wsl-usbip
          path: release-assets/windows

      - name: Download unpack helper
        if: ${{ env.XR_BUILD_UBUNTU_RELEASE == '1' }}
        uses: actions/download-artifact@v4
        with:
          name: unpack-xr-gate
          path: release-assets/unpack-helper

      - name: Download xrizer Corresponding Source
        if: ${{ env.XR_BUILD_XRIZER == '1' }}
        uses: actions/download-artifact@v4
        with:
          pattern: xrizer-corresponding-source-ubuntu-*
          merge-multiple: false
          path: release-assets/xrizer-source

      - name: Validate release assets
        run: |
          set -euo pipefail

          find release-assets -maxdepth 5 -type f -print -exec ls -lh {} \;

          if [[ "$XR_BUILD_UBUNTU_RELEASE" == "1" ]]; then
            test -f release-assets/models/hand-tracking-models-mercury.tar.gz
            test -f release-assets/unpack-helper/unpack_xr_gate.sh
          fi
          if [[ "$XR_RELEASE_WINDOWS_DRIVER" == "1" ]]; then
            test -f release-assets/windows/xr-gate-windows-wsl-usbip.zip
            test -f release-assets/windows/xr-gate-windows-wsl-usbip.zip.sha256
            (cd release-assets/windows && sha256sum -c xr-gate-windows-wsl-usbip.zip.sha256)
            python3 win/package_windows.py verify release-assets/windows/xr-gate-windows-wsl-usbip.zip \
              --frequencies "$XR_WINDOWS_OPENVR_BUILD_FREQUENCIES" --modes "$XR_WINDOWS_OPENVR_BUILD_MODES"
          fi

          if [[ "$XR_BUILD_UBUNTU_RELEASE" == "1" ]]; then
          for ubuntu in 24.04 26.04; do
            rm -rf verify/runtime
            mkdir -p verify/runtime
            tar -xzf release-assets/runtime/xr-gate-ubuntu-${ubuntu}-linux-x64.tar.gz -C verify/runtime

            test "$(cat verify/runtime/xr-gate/BUILD_UBUNTU_VERSION)" = "$ubuntu"
            test -d verify/runtime/xr-gate/bin
            test -x verify/runtime/xr-gate/run_xr_client.sh
            test -x verify/runtime/xr-gate/bin/capture_service_cpp/capture_tcp_probe
            test -x verify/runtime/xr-gate/devices/common/linux/scripts/capture_service/start_capture_service.sh
            test -x verify/runtime/xr-gate/devices/common/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
            test -x verify/runtime/xr-gate/bin/scripts/backends/xr_spatial/capture_profile.sh
            test -x verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/xreal_display_helper/start_xreal_helper_60hz.sh
            if [[ "$XR_BUILD_VENDOR_COMPONENTS" == "1" ]]; then
              test -x verify/runtime/xr-gate/bin/xreal_display_helper/xreal_display_helper
            else
              test ! -e verify/runtime/xr-gate/bin/xreal_display_helper/xreal_display_helper
            fi
            test -f verify/runtime/xr-gate/LICENSE
            test -f verify/runtime/xr-gate/LICENSES/MIT.txt
            test -f verify/runtime/xr-gate/THIRD_PARTY_NOTICES.md
            if [[ "$XR_BUILD_XRIZER" == "1" ]]; then
              test -d verify/runtime/xr-gate/bin/drivers/xrizer/runtime
              test -f verify/runtime/xr-gate/LICENSES/GPL-3.0-or-later.txt
              test -f verify/runtime/xr-gate/SOURCES/xrizer/SOURCE.txt
              test -f verify/runtime/xr-gate/SOURCES/xrizer/SHA256SUMS.txt
              RUNTIME_SOURCE="$(find verify/runtime/xr-gate/SOURCES/xrizer -maxdepth 1 -type f \
                -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
              RELEASE_SOURCE="$(find "release-assets/xrizer-source/xrizer-corresponding-source-ubuntu-${ubuntu}" -maxdepth 2 -type f \
                -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
              test -n "$RUNTIME_SOURCE"
              test -n "$RELEASE_SOURCE"
              cmp "$RUNTIME_SOURCE" "$RELEASE_SOURCE"
            else
              test ! -e verify/runtime/xr-gate/bin/drivers/xrizer
              test ! -e verify/runtime/xr-gate/LICENSES/GPL-3.0-or-later.txt
              test ! -e verify/runtime/xr-gate/SOURCES/xrizer
            fi
            test -f verify/runtime/xr-gate/bin/python/xr_client/configs/xreal_ultra.json
            test -f verify/runtime/xr-gate/bin/python/xr_client/configs/leap_motion_uvc_nrf54l15.json
            test -f verify/runtime/xr-gate/bin/python/xr_client/configs/leap_motion_uvc.json
            test -d verify/runtime/xr-gate/devices/leap_motion_uvc_nrf54l15
            test -d verify/runtime/xr-gate/devices/leap_motion_uvc
            test -x verify/runtime/xr-gate/devices/common/linux/scripts/runtime/install_runtime_deps_ubuntu24.sh
            test -x verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/install_runtime_deps_ubuntu24.sh
            test ! -e verify/runtime/xr-gate/devices/common/linux/scripts/build
            test ! -e verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
            test ! -e verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/capture_service
            test ! -e verify/runtime/xr-gate/devices/xreal_ultra/linux/scripts/xr_spatial
          done

          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.release_prerelease }}
        run: |
          set -euo pipefail

          ASSETS=()
          if [[ "$XR_BUILD_UBUNTU_RELEASE" == "1" ]]; then
            ASSETS+=(
              release-assets/runtime/xr-gate-ubuntu-24.04-linux-x64.tar.gz
              release-assets/runtime/xr-gate-ubuntu-26.04-linux-x64.tar.gz
              release-assets/models/hand-tracking-models-mercury.tar.gz
              release-assets/unpack-helper/unpack_xr_gate.sh
            )
          fi
          if [[ "$XR_RELEASE_WINDOWS_DRIVER" == "1" ]]; then
            ASSETS+=(release-assets/windows/xr-gate-windows-wsl-usbip.zip release-assets/windows/xr-gate-windows-wsl-usbip.zip.sha256)
          fi
          if [[ "$XR_BUILD_XRIZER" == "1" ]]; then
            for ubuntu in 24.04 26.04; do
              source_dir="release-assets/xrizer-source/xrizer-corresponding-source-ubuntu-${ubuntu}"
              source_archive="$(find "$source_dir" -maxdepth 2 -type f -name 'xrizer-corresponding-source-*.tar.gz' -print -quit)"
              test -n "$source_archive"
              asset="release-assets/xrizer-corresponding-source-ubuntu-${ubuntu}.tar.gz"
              cp "$source_archive" "$asset"
              ASSETS+=("$asset")
            done
          fi

          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "XR Gate $TAG" \
              --notes "XR Gate. Ubuntu release: $XR_BUILD_UBUNTU_RELEASE; Windows WSL/USB-IP release with SteamVR driver: $XR_RELEASE_WINDOWS_DRIVER. CPU profile: $XR_BUILD_CPU." \
              "${args[@]}"
          fi
