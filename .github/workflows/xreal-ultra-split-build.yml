name: XREAL Ultra split build

"on":
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      openvr_frequencies:
        description: "OpenVR driver frequencies to build"
        required: false
        default: "60 90"
      openvr_modes:
        description: "OpenVR driver modes to build"
        required: false
        default: "direct"
      include_xrizer:
        description: "Build optional xrizer GPL component"
        type: boolean
        required: false
        default: false
      upload_partial_artifacts:
        description: "Upload each partial out package, not only the merged package"
        type: boolean
        required: false
        default: false
      publish_release:
        description: "Upload final artifacts to a GitHub Release"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag, for example v0.1.0"
        type: string
        required: false
        default: "v0.1.0"
      release_prerelease:
        description: "Mark release as prerelease"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: xreal-ultra-split-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  XR_BUILD_CAPTURE_SERVICE_PYTHON: "0"
  XR_DOWNLOAD_HAND_TRACKING_MODELS: "0"
  XR_BUILD_XRIZER: ${{ github.event_name == 'workflow_dispatch' && inputs.include_xrizer && '1' || '0' }}
  XR_OPENVR_BUILD_FREQUENCIES: ${{ github.event_name == 'workflow_dispatch' && inputs.openvr_frequencies || '60 90' }}
  XR_OPENVR_BUILD_MODES: ${{ github.event_name == 'workflow_dispatch' && inputs.openvr_modes || 'direct' }}

jobs:

  release-unpack-helper:
    name: release unpack helper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate unpack helper
        run: |
          test -f devices/xreal_ultra/linux/scripts/unpack_xreal_ultra.sh
          bash -n devices/xreal_ultra/linux/scripts/unpack_xreal_ultra.sh
          chmod +x devices/xreal_ultra/linux/scripts/unpack_xreal_ultra.sh
          ls -lh devices/xreal_ultra/linux/scripts/unpack_xreal_ultra.sh

      - name: Upload unpack helper
        uses: actions/upload-artifact@v4
        with:
          name: unpack-xreal-ultra
          path: devices/xreal_ultra/linux/scripts/unpack_xreal_ultra.sh
          if-no-files-found: error
          retention-days: 7

  build-part:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: capture
            build_only: "capture_service_cpp xreal_display_helper"
          - name: runtime
            build_only: "imu_3dof xr_runtime_adapter override_controller xr_video bridges"
          - name: spatial
            build_only: "xr_spatial"
          - name: steamvr
            build_only: "openvr_driver steamvr_video_overlay steamvr_spatial_overlay steamvr_spatial_scene"
          - name: basalt
            build_only: "basalt_vio"
          - name: mercury
            build_only: "mercury_hand_tracking"
          - name: monado
            build_only: "monado_driver"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Install base build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates curl wget tar unzip rsync jq file \
            build-essential cmake ninja-build pkg-config \
            python3 python3-full python3-venv python3-pip \
            libopencv-dev libhidapi-dev libcli11-dev nlohmann-json3-dev \
            libeigen3-dev libboost-all-dev libceres-dev libtbb-dev \
            libfmt-dev libspdlog-dev
          git lfs install --local

      - name: Install SteamVR/OpenGL build packages
        if: ${{ matrix.name == 'steamvr' }}
        run: |
          sudo apt-get install -y --no-install-recommends \
            mesa-common-dev libopengl-dev libgl-dev libglx-dev libegl-dev \
            libvulkan-dev libsdl2-dev \
            libx11-dev libxrandr-dev libxext-dev libxfixes-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxxf86vm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-present-dev \
            libxcb-dri3-dev libxcb-xfixes0-dev

      - name: Install Monado X11/XCB build packages
        if: ${{ matrix.name == 'monado' }}
        run: |
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev vulkan-tools glslang-tools \
            libx11-dev libx11-xcb-dev libxrandr-dev libxext-dev libxfixes-dev libxxf86vm-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-present-dev \
            libxcb-dri3-dev libxcb-xfixes0-dev libxcb-keysyms1-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libudev-dev libhidapi-dev libsystemd-dev libdbus-1-dev

      - name: Build partial package
        env:
          XR_BUILD_ONLY: ${{ matrix.build_only }}
          XR_PACKAGE_ALLOW_PARTIAL: "1"
          CLONE_OPENVR: "1"
          CLONE_MONADO: "1"
        run: |
          df -h
          ./devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh
          du -sh out/xreal_ultra || true
          find out/xreal_ultra -maxdepth 4 -type f | sort | head -200

      - name: Validate capture launchers and TCP metadata probe
        if: ${{ matrix.name == 'capture' }}
        run: |
          set -euo pipefail
          test -x out/xreal_ultra/bin/scripts/capture_service_cpp/start_capture_service_cpp.sh
          test -x out/xreal_ultra/devices/xreal_ultra/linux/scripts/capture_service/start_capture_service_cpp.sh
          test -x out/xreal_ultra/bin/capture_service_cpp/capture_tcp_probe
          bash -n out/xreal_ultra/bin/scripts/capture_service_cpp/start_capture_service_cpp.sh
          bash -n out/xreal_ultra/devices/xreal_ultra/linux/scripts/capture_service/start_capture_service_cpp.sh
          out/xreal_ultra/bin/capture_service_cpp/capture_tcp_probe --help >/dev/null

          READY_FILE="$(mktemp)"
          rm -f "$READY_FILE"
          export READY_FILE
          python3 - <<'PY' &
          import json
          import os
          import socket

          hello = json.dumps({
              "protocol": "capture_net_v1_json_payload",
              "namespace": "ci_capture",
              "profile": "leap_motion_uvc_nrf54l15",
              "streams": {},
          }, separators=(",", ":")).encode("utf-8")

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(("127.0.0.1", 45679))
              server.listen(1)
              open(os.environ["READY_FILE"], "w", encoding="utf-8").close()
              connection, _ = server.accept()
              with connection:
                  connection.sendall(f"CAPHELLO {len(hello)}\n".encode("ascii"))
                  connection.sendall(hello)
                  connection.recv(64)
          PY
          SERVER_PID=$!
          for _ in $(seq 1 50); do
            [[ -f "$READY_FILE" ]] && break
            sleep 0.1
          done
          test -f "$READY_FILE"
          PROFILE="$(out/xreal_ultra/bin/capture_service_cpp/capture_tcp_probe \
            --host 127.0.0.1 \
            --port 45679 \
            --timeout-ms 2000 \
            --print-profile)"
          wait "$SERVER_PID"
          rm -f "$READY_FILE"
          test "$PROFILE" = "leap_motion_uvc_nrf54l15"

      - name: Validate capture profile resolver
        if: ${{ matrix.name == 'runtime' }}
        run: |
          bash backends/common/tests/capture_profile_smoke.sh

      - name: Validate xr_spatial SHM/TCP launchers
        if: ${{ matrix.name == 'spatial' }}
        run: |
          set -euo pipefail
          test -x out/xreal_ultra/bin/backends/xr_spatial/xr_spatial_backend
          test -x out/xreal_ultra/bin/scripts/backends/xr_spatial/start_xr_spatial_shm.sh
          test -x out/xreal_ultra/bin/scripts/backends/xr_spatial/start_xr_spatial_tcp.sh
          test -x out/xreal_ultra/devices/xreal_ultra/linux/scripts/xr_spatial/start_xr_spatial_shm.sh
          test -x out/xreal_ultra/devices/xreal_ultra/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          bash -n out/xreal_ultra/bin/scripts/backends/xr_spatial/start_xr_spatial_shm.sh
          bash -n out/xreal_ultra/bin/scripts/backends/xr_spatial/start_xr_spatial_tcp.sh
          bash -n out/xreal_ultra/devices/xreal_ultra/linux/scripts/xr_spatial/start_xr_spatial_tcp.sh
          out/xreal_ultra/bin/backends/xr_spatial/xr_spatial_backend --help | grep -q -- '--capture-transport'
          out/xreal_ultra/bin/backends/xr_spatial/xr_spatial_backend --help | grep -q -- '--capture-tcp-host'


      - name: Archive partial package
        run: |
          tar -C out -czf xreal_ultra_${{ matrix.name }}.tar.gz xreal_ultra
          ls -lh xreal_ultra_${{ matrix.name }}.tar.gz

      - name: Upload partial package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_partial_artifacts == true }}
        uses: actions/upload-artifact@v4
        with:
          name: xreal-ultra-part-${{ matrix.name }}
          path: xreal_ultra_${{ matrix.name }}.tar.gz
          retention-days: 3

      - name: Upload merge input
        uses: actions/upload-artifact@v4
        with:
          name: xreal-ultra-merge-input-${{ matrix.name }}
          path: xreal_ultra_${{ matrix.name }}.tar.gz
          retention-days: 3


  hand-tracking-models-mercury:
    name: hand-tracking models Mercury
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Install download packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates curl tar coreutils rsync \
            python3 python3-venv
          git lfs install --local

      - name: Download Mercury hand-tracking models
        env:
          XR_BUILD_ONLY: "hand_tracking_models"
          XR_PACKAGE_ALLOW_PARTIAL: "1"
          XR_DOWNLOAD_HAND_TRACKING_MODELS: "1"
          CLONE_MERCURY_DRIVER: "1"
          FETCH_MERCURY_DRIVER: "1"
          RESET_MERCURY_DRIVER_TREE: "1"
        run: |
          df -h
          ./devices/xreal_ultra/linux/scripts/install_xreal_ultra_out.sh

          MODEL_DIR="out/xreal_ultra/bin/hand-tracking-models/mercury"
          test -f "$MODEL_DIR/grayscale_detection_160x160.onnx"
          test -f "$MODEL_DIR/grayscale_keypoint_jan18.onnx"

          mkdir -p model_artifact/hand-tracking-models/mercury
          cp -a "$MODEL_DIR"/*.onnx model_artifact/hand-tracking-models/mercury/

          cat > model_artifact/hand-tracking-models/mercury/SOURCE.txt <<'EOF'
          Mercury hand-tracking ONNX models.

          Files:
            grayscale_detection_160x160.onnx
            grayscale_keypoint_jan18.onnx

          Upstream:
            https://github.com/moshimeow/mercury_steamvr_driver

          Pinned ref:
            e3948ace94a9f2cbd949adf50ffcc082002337cc

          License/notice:
            These ONNX model files are third-party artifacts and are not covered by
            the MIT license of the xr_tracking project. They remain under their
            upstream terms. Keep this notice with redistributed copies.

          Install into a downloaded XREAL Ultra runtime package:
            tar -C out/xreal_ultra/bin -xzf hand-tracking-models-mercury.tar.gz
          EOF

          (
            cd model_artifact/hand-tracking-models/mercury
            sha256sum *.onnx > SHA256SUMS.txt
          )

          find model_artifact -type f -print -exec ls -lh {} \;
          tar -C model_artifact -czf hand-tracking-models-mercury.tar.gz hand-tracking-models
          ls -lh hand-tracking-models-mercury.tar.gz

      - name: Upload Mercury hand-tracking models
        uses: actions/upload-artifact@v4
        with:
          name: hand-tracking-models-mercury
          path: hand-tracking-models-mercury.tar.gz
          retention-days: 7

  merge-package:
    name: merge runtime package
    runs-on: ubuntu-24.04
    needs: build-part
    timeout-minutes: 60

    steps:
      - name: Download partial packages
        uses: actions/download-artifact@v4
        with:
          pattern: xreal-ultra-merge-input-*
          path: partials
          merge-multiple: false

      - name: Merge partial packages
        run: |
          mkdir -p merged
          find partials -type f -name 'xreal_ultra_*.tar.gz' -print -exec ls -lh {} \;
          for archive in $(find partials -type f -name 'xreal_ultra_*.tar.gz' | sort); do
            echo "merge $archive"
            tar -xzf "$archive" -C merged
          done
          test -d merged/xreal_ultra/bin
          test -x merged/xreal_ultra/run_xr_client.sh
          test -x merged/xreal_ultra/bin/capture_service_cpp/capture_tcp_probe
          du -sh merged/xreal_ultra
          find merged/xreal_ultra -maxdepth 4 -type f | sort | head -300
          tar -C merged -czf xreal_ultra_linux_x64.tar.gz xreal_ultra
          ls -lh xreal_ultra_linux_x64.tar.gz

      - name: Upload merged package
        uses: actions/upload-artifact@v4
        with:
          name: xreal-ultra-linux-x64
          path: xreal_ultra_linux_x64.tar.gz
          retention-days: 7


  publish-release:
    name: publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - release-unpack-helper
      - hand-tracking-models-mercury
      - merge-package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download merged runtime package
        uses: actions/download-artifact@v4
        with:
          name: xreal-ultra-linux-x64
          path: release-assets/runtime

      - name: Download Mercury hand-tracking models
        uses: actions/download-artifact@v4
        with:
          name: hand-tracking-models-mercury
          path: release-assets/models

      - name: Download unpack helper
        uses: actions/download-artifact@v4
        with:
          name: unpack-xreal-ultra
          path: release-assets/unpack-helper

      - name: Validate release assets
        run: |
          set -euo pipefail

          find release-assets -maxdepth 5 -type f -print -exec ls -lh {} \;

          test -f release-assets/runtime/xreal_ultra_linux_x64.tar.gz
          test -f release-assets/models/hand-tracking-models-mercury.tar.gz
          test -f release-assets/unpack-helper/unpack_xreal_ultra.sh

          mkdir -p verify/runtime
          tar -xzf release-assets/runtime/xreal_ultra_linux_x64.tar.gz -C verify/runtime

          test -d verify/runtime/xreal_ultra/bin
          test -x verify/runtime/xreal_ultra/run_xr_client.sh
          test -x verify/runtime/xreal_ultra/bin/capture_service_cpp/capture_tcp_probe

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.release_prerelease }}
        run: |
          set -euo pipefail

          ASSETS=(
            release-assets/runtime/xreal_ultra_linux_x64.tar.gz
            release-assets/models/hand-tracking-models-mercury.tar.gz
            release-assets/unpack-helper/unpack_xreal_ultra.sh
          )

          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists: $TAG"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "XR Gate $TAG" \
              --notes "Automated XR Gate Linux x64 release artifact." \
              "${args[@]}"
          fi
