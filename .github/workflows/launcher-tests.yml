name: Launcher configuration tests

"on":
  pull_request:
    paths: ['xr_client/**', 'docker/**', 'win/**', 'runtime_adapters/xr_runtime_adapter/scripts/linux/start_xr_runtime_adapter_shm.sh', 'override_controller/scripts/linux/**', 'override_controller/tests/**', 'override_controller/configs/**', 'devices/common/linux/scripts/build/package_device_out.sh', 'drivers/**', 'devices/common/common.env', 'devices/common/linux/scripts/build/**', 'devices/common/linux/scripts/monado_driver/**', 'devices/common/linux/scripts/openvr_driver/**', '.github/workflows/launcher-tests.yml', '.github/workflows/xr-gate-split-build.yml']
  push:
    branches: [main, master, win]
    paths: ['xr_client/**', 'docker/**', 'win/**', 'runtime_adapters/xr_runtime_adapter/scripts/linux/start_xr_runtime_adapter_shm.sh', 'override_controller/scripts/linux/**', 'override_controller/tests/**', 'override_controller/configs/**', 'devices/common/linux/scripts/build/package_device_out.sh', 'drivers/**', 'devices/common/common.env', 'devices/common/linux/scripts/build/**', 'devices/common/linux/scripts/monado_driver/**', 'devices/common/linux/scripts/openvr_driver/**', '.github/workflows/launcher-tests.yml', '.github/workflows/xr-gate-split-build.yml']
  workflow_dispatch:

jobs:
  startup-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r xr_client/requirements.txt
      - run: python -m unittest discover -s xr_client/tests -p 'test_startup_rules.py'
      - run: python -m unittest discover -s xr_client/tests -p 'test_prestart_confirmation.py'
      - run: python -m unittest discover -s docker/tests -p 'test*.py'
      - name: ALSA runtime for hardware-free audio playback tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2t64
      - run: python -m unittest discover -s win/tests -p 'test*.py'
      - run: python -m unittest discover -s drivers/tests -p 'test*.py'
      - name: Validate driver package shell launchers
        run: |
          bash -n drivers/build_profiles.sh
          bash -n drivers/openvr_driver/scripts/build_driver.sh
          bash -n drivers/openvr_driver/scripts/build_and_register_driver.sh
          bash -n drivers/openvr_driver/scripts/register_driver.sh
          bash -n drivers/monado_driver/scripts/linux/install.sh
          bash -n drivers/monado_driver/scripts/linux/start.sh
          bash -n drivers/xrizer/scripts/linux/start_openvr_app_via_monado.sh
      - run: python -m unittest discover -s override_controller/tests -p 'test*.py'
  windows-launcher:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Windows PowerShell 5.1 launcher compatibility
        shell: powershell
        run: '& ./xr_client/tests/test_windows_launcher.ps1'
      - name: Windows installer and hardware env compatibility
        shell: powershell
        run: '& ./win/tests/verify-env.ps1'
      - name: SteamVR discovery with stale paths and unavailable drives
        shell: powershell
        run: '& ./win/tests/verify-steamvr-paths.ps1'
      - name: Real driver JSON, Unicode state, OpenVR registration and administrator results
        shell: powershell
        run: '& ./win/tests/verify-runtime-contracts.ps1'
      - name: Device-specific driver selection, refresh and cache
        shell: powershell
        run: '& ./win/tests/verify-driver-devices.ps1'
      - name: Bluetooth firmware setup and selected-dongle recovery
        shell: powershell
        run: '& ./win/tests/verify-bluetooth-firmware.ps1'
      - name: Bluetooth VID:PID selection and explicit BUSID priority
        shell: powershell
        run: '& ./win/tests/verify-bluetooth-selection.ps1'
      - name: USB command deadline, process cleanup and changed BUSID
        shell: powershell
        run: '& ./win/tests/verify-usb-timeout.ps1'
      - name: Device observation and scoped partial USB cleanup
        shell: powershell
        run: '& ./win/tests/verify-device-lifecycle.ps1'
      - name: Runtime console ownership and cancellation of delayed WSL startup
        shell: powershell
        run: '& ./win/tests/verify-runtime-window.ps1'
      - name: Hidden runtime output and exit diagnostics
        shell: powershell
        run: '& ./win/tests/verify-runtime-output.ps1'
      - name: Display selection before installation and setup readiness
        shell: powershell
        run: '& ./win/tests/verify-setup-display.ps1'
      - name: Session cleanup ignores damaged or changed settings
        shell: powershell
        run: '& ./win/tests/verify-cleanup-settings.ps1'
      - name: Confirmed Ubuntu deletion and cleanup before unregistering
        shell: powershell
        run: '& ./win/tests/verify-delete.ps1'
      - name: First Ubuntu login and dynamic user detection
        shell: powershell
        run: '& ./win/tests/verify-first-login.ps1'
      - name: Graceful SteamVR shutdown and bounded cleanup
        shell: powershell
        run: '& ./win/tests/verify-steamvr-stop.ps1'
      - name: Restart tracking while preserving SteamVR and USB
        shell: powershell
        run: '& ./win/tests/verify-restart.ps1'
      - name: Independent platform releases and latest runtime selection
        shell: powershell
        run: '& ./win/tests/verify-release-platforms.ps1'
      - name: Partial TCP streams obey the Windows PowerShell deadline
        run: python -m unittest discover -s win/tests -p 'test_windows_contracts.py'
      - name: Publish self-contained WPF executable and smoke-test its UI
        shell: pwsh
        run: '& ./win/launcher/build.ps1 -OutputDirectory ./out/windows-launcher'
      - name: Package launcher with installation scripts
        shell: pwsh
        run: |
          python win/package_windows.py launcher --launcher-exe out/windows-launcher/XR-Gate.exe `
            --output out/xr-gate-windows-wsl2-usbip-launcher.zip
          if ($LASTEXITCODE -ne 0) { throw 'Launcher packaging failed' }
      - name: Upload portable Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: xr-gate-windows-wsl2-usbip-launcher
          path: |
            out/xr-gate-windows-wsl2-usbip-launcher.zip
            out/xr-gate-windows-wsl2-usbip-launcher.zip.sha256
          if-no-files-found: error
          retention-days: 14
